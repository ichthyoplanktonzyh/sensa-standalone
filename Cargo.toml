[workspace]
members = ["crates/sensa-core", "crates/sensa-library"]
resolver = "2"
exclude = ["apps/sensa_native/rust"]

[workspace.package]
edition = "2024"
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["std", "serde"] }
