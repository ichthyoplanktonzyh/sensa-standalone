<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Sensa V1 · 高保真产品原型</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #1f1d2b;
      --ink-soft: #6c6878;
      --ink-faint: #9d98aa;
      --paper: #f8f6f4;
      --paper-strong: #fffefd;
      --line: rgba(45, 38, 67, .09);
      --lavender: #d9d7f0;
      --blush: #f2d6da;
      --cream: #f4e6ca;
      --orange: #f36f3f;
      --orange-dark: #d9562b;
      --teal: #1d9a83;
      --teal-dark: #147663;
      --navy: #151c35;
      --error: #c64545;
      --shadow-sm: 0 8px 24px rgba(43, 35, 66, .08);
      --shadow-md: 0 18px 50px rgba(23, 18, 43, .16);
      --radius-sm: 14px;
      --radius-md: 22px;
      --radius-lg: 30px;
      --ease-out: cubic-bezier(.16, 1, .3, 1);
      --ease-in-out: cubic-bezier(.65, 0, .35, 1);
      --s1: 4px;
      --s2: 8px;
      --s3: 12px;
      --s4: 16px;
      --s5: 20px;
      --s6: 24px;
      --s8: 32px;
      --s10: 40px;
      --s12: 48px;
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
        "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      color: var(--ink);
      background:
        radial-gradient(circle at 12% 15%, rgba(101, 85, 155, .22), transparent 28%),
        radial-gradient(circle at 86% 80%, rgba(243, 111, 63, .13), transparent 26%),
        #101022;
      -webkit-font-smoothing: antialiased;
    }
    button, input { font: inherit; }
    button { color: inherit; }
    button:focus-visible, input:focus-visible {
      outline: 3px solid rgba(243, 111, 63, .42);
      outline-offset: 2px;
    }
    button:disabled { cursor: not-allowed; opacity: .45; }
    svg { display: block; }

    .prototype-shell {
      min-height: 100vh;
      display: grid;
      grid-template-columns: 414px minmax(420px, 520px);
      justify-content: center;
      align-items: center;
      gap: 56px;
      padding: 34px;
    }
    .phone-wrap { position: relative; }
    .phone {
      position: relative;
      width: 390px;
      height: 844px;
      overflow: hidden;
      border: 8px solid #080812;
      border-radius: 48px;
      background: var(--paper);
      box-shadow: 0 36px 100px rgba(0, 0, 0, .48), inset 0 0 0 1px rgba(255,255,255,.2);
      isolation: isolate;
    }
    .phone::after {
      content: "";
      position: absolute;
      left: 50%; bottom: 6px;
      width: 118px; height: 4px;
      border-radius: 99px;
      transform: translateX(-50%);
      background: rgba(18, 17, 27, .56);
      z-index: 80;
      pointer-events: none;
    }
    .screen {
      position: absolute;
      inset: 0;
      overflow: hidden;
      animation: screen-in .34s var(--ease-out) both;
    }
    .screen.scroll { overflow-y: auto; scrollbar-width: none; }
    .screen.scroll::-webkit-scrollbar { display: none; }
    .statusbar {
      height: 35px;
      padding: 12px 18px 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 12px;
      font-weight: 750;
      letter-spacing: .02em;
      position: relative;
      z-index: 20;
    }
    .status-icons { display: flex; gap: 5px; align-items: center; }
    .status-icons i { width: 4px; height: 4px; border-radius: 50%; background: currentColor; opacity: .74; }
    .status-icons b { width: 18px; height: 9px; border: 1.5px solid currentColor; border-radius: 3px; display: block; opacity: .74; }

    .icon {
      width: 22px; height: 22px;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.9;
      stroke-linecap: round;
      stroke-linejoin: round;
      pointer-events: none;
    }
    .icon-button {
      appearance: none;
      border: 0;
      background: transparent;
      width: 42px; height: 42px;
      display: inline-grid;
      place-items: center;
      border-radius: 50%;
      cursor: pointer;
      transition: background .16s ease, transform .16s ease;
    }
    .icon-button:hover { background: rgba(255,255,255,.42); }
    .icon-button:active { transform: scale(.93); }
    .icon-button.active { color: var(--orange); background: rgba(243,111,63,.1); }

    .home-screen {
      color: #23202d;
      background:
        radial-gradient(circle at 78% 14%, rgba(255, 238, 178, .82), transparent 20%),
        radial-gradient(circle at 18% 38%, rgba(216, 211, 247, .95), transparent 31%),
        linear-gradient(160deg, #f5dba8 0%, #dad8f0 42%, #f0d1d6 100%);
    }
    .home-screen::before, .study-screen::before {
      content: "";
      position: absolute;
      inset: 0;
      opacity: .48;
      pointer-events: none;
      background-image:
        radial-gradient(circle, rgba(255,255,255,.85) 0 1px, transparent 2px),
        radial-gradient(circle, rgba(255,246,183,.7) 0 1px, transparent 2px);
      background-size: 92px 92px, 137px 137px;
      background-position: 20px 30px, 44px 4px;
      animation: drift 16s linear infinite alternate;
    }
    .home-body { position: relative; z-index: 2; height: calc(100% - 35px); padding: 14px 20px 24px; display: flex; flex-direction: column; }
    .home-brand { display: flex; align-items: center; gap: 11px; }
    .avatar {
      width: 50px; height: 50px;
      border: 0; border-radius: 50%;
      color: white; cursor: pointer;
      display: grid; place-items: center;
      background: linear-gradient(145deg, #595875, #9a91a9);
      box-shadow: 0 8px 20px rgba(45,39,72,.2), inset 0 0 0 2px rgba(255,255,255,.72);
      font-weight: 850;
    }
    .brand-lockup { display: grid; gap: 1px; }
    .brand-lockup strong { letter-spacing: .18em; font-size: 15px; }
    .brand-lockup small { font-size: 10px; color: rgba(31,29,43,.56); }
    .home-date { text-align: center; margin: 33px 0 0; font-size: 12px; color: rgba(31,29,43,.5); }
    .home-focus {
      margin: 25px auto 0;
      width: 210px;
      padding: 23px 18px 20px;
      text-align: center;
      border: 1px solid rgba(255,255,255,.44);
      border-radius: 28px;
      background: rgba(255,255,255,.36);
      box-shadow: var(--shadow-sm), inset 0 1px rgba(255,255,255,.58);
      backdrop-filter: blur(18px);
    }
    .home-focus .spark { font-size: 24px; display: block; margin-bottom: 11px; }
    .home-focus strong { font-size: 20px; line-height: 1.28; display: block; }
    .home-focus span { display: block; color: rgba(31,29,43,.56); font-size: 12px; margin-top: 8px; }
    .home-copy { text-align: center; margin-top: 20px; }
    .home-copy h1 { font-size: 24px; letter-spacing: -.03em; margin: 0; }
    .home-copy p { margin: 7px 0 0; font-size: 12px; color: rgba(31,29,43,.58); }
    .home-spacer { flex: 1; min-height: 54px; }
    .today-summary {
      display: grid; grid-template-columns: 1fr 1fr; gap: 10px;
      margin-bottom: 10px;
    }
    .summary-cell {
      padding: 14px 15px;
      background: rgba(255,255,255,.5);
      border: 1px solid rgba(255,255,255,.5);
      border-radius: 18px;
      backdrop-filter: blur(16px);
    }
    .summary-cell strong { font-size: 25px; display: block; }
    .summary-cell b { font-size: 13px; }
    .summary-cell small { color: rgba(31,29,43,.54); display: block; margin-top: 2px; }
    .primary-button, .secondary-button {
      width: 100%; min-height: 50px;
      border-radius: 16px;
      border: 0;
      padding: 12px 18px;
      font-weight: 800;
      cursor: pointer;
      transition: transform .16s ease, box-shadow .16s ease, background .16s ease;
    }
    .primary-button { color: white; background: linear-gradient(135deg, var(--orange), #f08451); box-shadow: 0 10px 24px rgba(216,86,43,.24); }
    .primary-button:hover { box-shadow: 0 13px 28px rgba(216,86,43,.3); transform: translateY(-1px); }
    .primary-button:active, .secondary-button:active { transform: scale(.985); }
    .secondary-button { background: rgba(255,255,255,.7); border: 1px solid var(--line); }
    .plan-note { text-align: center; font-size: 11px; color: rgba(31,29,43,.52); margin: 9px 0 14px; }
    .home-nav { display: grid; grid-template-columns: repeat(3,1fr); gap: 8px; }
    .home-nav button {
      border: 0; background: transparent; cursor: pointer;
      min-height: 54px; border-radius: 16px;
      display: flex; flex-direction: column; gap: 4px; align-items: center; justify-content: center;
      font-size: 11px; font-weight: 700;
    }
    .home-nav button:hover { background: rgba(255,255,255,.35); }

    .utility-screen { background: #f7f6f4; }
    .utility-head {
      position: sticky; top: 0; z-index: 20;
      display: grid; grid-template-columns: 44px 1fr 44px;
      align-items: center; min-height: 62px;
      padding: 3px 12px 5px;
      background: rgba(247,246,244,.9);
      backdrop-filter: blur(18px);
      border-bottom: 1px solid rgba(45,38,67,.04);
    }
    .utility-head h1 { margin: 0; text-align: center; font-size: 18px; }
    .utility-body { padding: 12px 18px 42px; }
    .section-title { display: flex; align-items: end; justify-content: space-between; margin: 22px 2px 11px; }
    .section-title h2 { font-size: 18px; margin: 0; }
    .section-title span { color: var(--ink-soft); font-size: 11px; }
    .card {
      border-radius: var(--radius-md);
      background: var(--paper-strong);
      border: 1px solid rgba(45,38,67,.045);
      box-shadow: 0 8px 24px rgba(38,31,60,.045);
    }
    .book-hero { padding: 17px; display: grid; grid-template-columns: 76px 1fr; gap: 15px; }
    .book-cover {
      width: 76px; height: 100px; border-radius: 12px;
      color: white; padding: 11px 9px; display: flex; flex-direction: column; justify-content: space-between;
      background: linear-gradient(155deg, #15233e, #9c6c73 58%, #e59c69);
      box-shadow: 0 8px 18px rgba(29,31,55,.2);
    }
    .book-cover b { font-size: 11px; letter-spacing: .13em; }
    .book-cover span { font-family: Georgia, serif; font-size: 17px; line-height: 1.05; }
    .book-meta h2 { margin: 4px 0 2px; font-size: 19px; }
    .book-meta p { margin: 0; color: var(--ink-soft); font-size: 11px; line-height: 1.5; }
    .big-number { display: flex; align-items: end; gap: 6px; margin-top: 12px; }
    .big-number strong { font-size: 31px; line-height: 1; }
    .big-number span { font-size: 10px; color: var(--ink-soft); padding-bottom: 2px; }
    .progress-track { height: 5px; border-radius: 99px; background: #eeeae8; overflow: hidden; margin: 15px 17px 7px; }
    .progress-track i { display: block; height: 100%; width: 34%; background: var(--orange); border-radius: inherit; }
    .progress-copy { display: flex; justify-content: space-between; padding: 0 17px 14px; font-size: 10px; color: var(--ink-soft); }
    .search-box { margin-top: 12px; position: relative; }
    .search-box svg { position: absolute; left: 13px; top: 12px; color: var(--ink-faint); width: 18px; }
    .search-box input { width: 100%; height: 42px; border: 1px solid var(--line); border-radius: 14px; padding: 0 12px 0 39px; background: white; }
    .list-card { overflow: hidden; }
    .sense-row, .content-row, .setting-row {
      width: 100%; min-height: 65px; border: 0; border-bottom: 1px solid var(--line);
      background: transparent; padding: 12px 14px; cursor: pointer;
      display: grid; grid-template-columns: 1fr auto; gap: 12px; align-items: center; text-align: left;
    }
    .sense-row:last-child, .content-row:last-child, .setting-row:last-child { border-bottom: 0; }
    .sense-row:hover, .content-row:hover, .setting-row:hover { background: rgba(222,218,236,.18); }
    .sense-row strong, .content-row strong { display: block; font-size: 15px; }
    .sense-row span, .content-row span { color: var(--ink-soft); display: block; font-size: 11px; margin-top: 3px; line-height: 1.4; }
    .badge { display: inline-flex; align-items: center; justify-content: center; min-height: 26px; border-radius: 99px; padding: 4px 9px; font-style: normal; font-size: 10px; font-weight: 800; color: var(--orange-dark); background: #fff0e9; }
    .badge.mastered { color: var(--teal-dark); background: #e9f7f3; }
    .content-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .metric-card { padding: 15px; min-height: 100px; }
    .metric-card strong { font-size: 26px; display: block; }
    .metric-card b { font-size: 13px; }
    .metric-card small { display: block; color: var(--ink-soft); margin-top: 5px; }
    .empty-state { padding: 28px 18px; text-align: center; color: var(--ink-soft); }
    .empty-state strong { color: var(--ink); display: block; margin-bottom: 5px; }
    .tabs { display: grid; grid-template-columns: 1fr 1fr; background: #ebe9e7; border-radius: 99px; padding: 3px; margin: 2px 0 16px; }
    .tabs button { border: 0; background: transparent; min-height: 38px; border-radius: 99px; cursor: pointer; color: var(--ink-soft); font-weight: 800; }
    .tabs button.active { background: white; color: var(--ink); box-shadow: 0 3px 10px rgba(38,31,60,.08); }
    .plan-card { padding: 18px; }
    .plan-card small { color: var(--orange-dark); font-weight: 800; letter-spacing: .08em; }
    .plan-card h2 { margin: 8px 0 4px; font-size: 22px; }
    .plan-card p { margin: 0; color: var(--ink-soft); font-size: 12px; }
    .plan-stats { display: grid; grid-template-columns: repeat(3,1fr); gap: 8px; margin-top: 17px; }
    .plan-stats div { padding: 11px 8px; text-align: center; background: #f6f3f1; border-radius: 14px; }
    .plan-stats b { display: block; font-size: 20px; }
    .plan-stats span { color: var(--ink-soft); font-size: 9px; }
    .calendar { padding: 15px; margin-top: 12px; }
    .week { display: grid; grid-template-columns: repeat(7,1fr); text-align: center; gap: 4px; }
    .week span { color: var(--ink-faint); font-size: 9px; padding: 5px 0; }
    .week b { font-size: 11px; width: 28px; height: 28px; display: grid; place-items: center; margin: auto; border-radius: 50%; }
    .week b.today { color: white; background: var(--orange); }
    .setting-row { min-height: 58px; }
    .setting-row b { font-size: 14px; }
    .setting-row span { color: var(--ink-soft); font-size: 11px; }
    .switch { width: 42px; height: 24px; padding: 3px; border-radius: 99px; background: #d8d5d3; transition: background .2s ease; }
    .switch i { display: block; width: 18px; height: 18px; border-radius: 50%; background: white; box-shadow: 0 2px 5px rgba(0,0,0,.15); transition: transform .25s var(--ease-out); }
    .switch.on { background: var(--orange); }
    .switch.on i { transform: translateX(18px); }
    .profile-hero { text-align: center; padding: 30px 18px 22px; }
    .profile-avatar { width: 84px; height: 84px; margin: auto; border-radius: 50%; display: grid; place-items: center; color: white; font-size: 28px; font-weight: 850; background: linear-gradient(145deg,#545573,#aaa0b1); box-shadow: var(--shadow-md); }
    .profile-hero h2 { margin: 15px 0 2px; }
    .profile-hero p { margin: 0; color: var(--ink-soft); font-size: 12px; }

    .study-screen {
      background:
        radial-gradient(circle at 85% 7%, rgba(246,225,180,.82), transparent 24%),
        linear-gradient(170deg, #eee4cf 0%, #d9d7ee 46%, #edd2dc 100%);
    }
    .study-screen::before { opacity: .24; }
    .study-body { position: relative; z-index: 2; height: calc(100% - 35px); display: flex; flex-direction: column; }
    .study-toolbar { min-height: 55px; padding: 4px 10px; display: grid; grid-template-columns: 44px 1fr auto; align-items: center; }
    .study-progress { text-align: center; font-size: 13px; font-weight: 850; }
    .study-tools { display: flex; align-items: center; }
    .master-button { width: 42px; height: 42px; border: 0; background: transparent; border-radius: 50%; cursor: pointer; font-size: 18px; font-weight: 900; }
    .master-button:hover { background: rgba(255,255,255,.4); }
    .study-main { flex: 1; min-height: 0; overflow-y: auto; scrollbar-width: none; padding: 13px 18px 118px; }
    .study-main::-webkit-scrollbar { display: none; }
    .study-footer { position: absolute; z-index: 12; left: 18px; right: 18px; bottom: 24px; }
    .eyebrow { font-size: 10px; color: #736b83; font-weight: 850; letter-spacing: .08em; text-transform: uppercase; }
    .study-title { margin: 8px 0 5px; font-size: 28px; line-height: 1.08; letter-spacing: -.035em; }
    .study-guide { margin: 0; color: #716c7a; font-size: 12px; line-height: 1.55; }
    .scene-card { margin-top: 22px; padding: 14px; border-radius: 24px; background: rgba(255,255,255,.55); box-shadow: var(--shadow-sm); border: 1px solid rgba(255,255,255,.5); backdrop-filter: blur(14px); }
    .scene-art { height: 92px; border-radius: 17px; overflow: hidden; position: relative; background: linear-gradient(140deg, #f7e7c9, #d7d6ed); }
    .scene-art::before { content: ""; position: absolute; width: 58px; height: 58px; border-radius: 50%; left: 27px; top: 16px; background: #f37b4b; box-shadow: 175px 18px 0 -13px #53aa93; opacity: .9; }
    .scene-art::after { content: ""; position: absolute; left: 55px; right: 38px; top: 49px; height: 2px; background: #77728b; transform: rotate(-6deg); box-shadow: 0 17px 0 rgba(119,114,139,.52); }
    .scene-card p { font-size: 15px; line-height: 1.72; margin: 14px 2px 4px; }
    .scene-card small { color: var(--ink-soft); line-height: 1.5; display: block; }
    .lexeme-head { padding-top: 3px; }
    .lexeme-head h1 { font-size: 47px; line-height: 1; margin: 4px 0 9px; letter-spacing: -.055em; }
    .pronunciation-row { display: flex; align-items: center; gap: 9px; color: #514d5d; }
    .audio-pill { border: 0; min-height: 30px; border-radius: 99px; background: rgba(255,255,255,.52); padding: 5px 10px; display: inline-flex; align-items: center; gap: 6px; cursor: pointer; font-size: 11px; font-weight: 800; }
    .audio-pill.playing { color: white; background: var(--orange); }
    .audio-pill .icon { width: 15px; height: 15px; }
    .ipa { font-family: Georgia, serif; font-size: 16px; }
    .sense-focus { margin-top: 19px; }
    .sense-label { display: inline-flex; background: rgba(255,255,255,.55); color: #6f687b; font-size: 10px; padding: 5px 8px; border-radius: 99px; font-weight: 800; }
    .sense-focus h2 { margin: 8px 0 0; font-size: 23px; }
    .bridge-card, .example-inline, .scene-recall, .repair-card { margin-top: 13px; padding: 15px; border-radius: 19px; background: rgba(255,255,255,.62); border: 1px solid rgba(255,255,255,.55); box-shadow: 0 6px 18px rgba(38,31,60,.055); }
    .bridge-card b, .example-inline > b, .repair-card > b { display: block; font-size: 10px; color: var(--ink-soft); margin-bottom: 7px; }
    .bridge-card p { margin: 0; font-size: 13px; line-height: 1.65; }
    .example-inline { position: relative; padding-right: 52px; cursor: pointer; width: 100%; text-align: left; }
    .example-inline p { margin: 0; font-family: Georgia, "Times New Roman", serif; font-size: 16px; line-height: 1.5; }
    .example-inline small { display: block; color: var(--ink-soft); line-height: 1.45; margin-top: 6px; }
    mark { color: var(--orange-dark); background: transparent; font-weight: 800; }
    .open-example { position: absolute; right: 12px; bottom: 12px; width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; color: var(--orange-dark); background: #fff7f2; }
    .scene-recall { padding: 0; overflow: hidden; }
    .scene-recall button { width: 100%; border: 0; background: transparent; padding: 13px 15px; display: flex; align-items: center; justify-content: space-between; cursor: pointer; font-size: 12px; font-weight: 800; }
    .scene-recall p { margin: 0; padding: 0 15px 14px; color: var(--ink-soft); font-size: 12px; line-height: 1.55; }
    .audio-note { margin: 10px 0 0; text-align: center; color: #777181; font-size: 10px; }
    .audio-note.playing { color: var(--orange-dark); font-weight: 800; }
    .choice-list { display: grid; gap: 11px; margin-top: 22px; }
    .choice-button { width: 100%; border: 1px solid rgba(45,38,67,.07); background: rgba(255,255,255,.58); border-radius: 18px; padding: 15px; text-align: left; cursor: pointer; box-shadow: 0 7px 18px rgba(38,31,60,.045); }
    .choice-button strong { display: block; font-size: 13px; }
    .choice-button span { display: block; color: var(--ink-soft); font-size: 11px; margin-top: 6px; line-height: 1.45; }
    .choice-button.selected { border-color: var(--orange); box-shadow: 0 0 0 2px rgba(243,111,63,.12); }
    .choice-button.correct { border-color: var(--teal); background: rgba(232,248,244,.75); }
    .choice-button.wrong { border-color: var(--error); background: rgba(255,238,238,.72); }
    .feedback { margin-top: 13px; padding: 13px; border-radius: 15px; background: rgba(255,255,255,.58); font-size: 12px; line-height: 1.55; }
    .feedback.good { color: var(--teal-dark); }
    .feedback.bad { color: #8d3939; }
    .cloze-card { margin-top: 22px; padding: 19px; border-radius: 22px; background: rgba(255,255,255,.58); box-shadow: var(--shadow-sm); }
    .cloze-card p { margin: 0; font-family: Georgia, serif; font-size: 20px; line-height: 1.55; }
    .cloze-card small { display: block; color: var(--ink-soft); line-height: 1.5; margin-top: 10px; }
    .answer-row { display: grid; grid-template-columns: 1fr auto; gap: 8px; margin-top: 15px; }
    .answer-row input { min-width: 0; height: 48px; border-radius: 15px; border: 1px solid rgba(45,38,67,.1); padding: 0 14px; background: rgba(255,255,255,.7); }
    .answer-row button { border: 0; border-radius: 15px; color: white; background: var(--orange); padding: 0 18px; font-weight: 800; cursor: pointer; }
    .finish-screen { background: linear-gradient(160deg,#f2e6cb,#d9d7ed 50%,#eed2da); }
    .finish-body { height: calc(100% - 35px); padding: 90px 26px 35px; text-align: center; display: flex; flex-direction: column; }
    .finish-star { font-size: 54px; animation: pop .6s var(--ease-out) both; }

      const atLast = state.exampleIndex === pkg.examples.length - 1;
      const directionClass = state.exampleDirection ? `from-${state.exampleDirection}` : "";
      return `<section class="screen example-screen" aria-label="全屏例句卡">${statusbar()}<div class="example-shell"><article class="example-card ${directionClass}" data-example-swipe role="group" aria-roledescription="例句轮播" aria-label="第 ${state.exampleIndex + 1} 条例句，共 ${pkg.examples.length} 条"><div class="example-visual"><span class="example-source">${escapeHtml(ex.source)} · ${state.exampleIndex + 1}/${pkg.examples.length}</span><button class="icon-button example-close" type="button" data-action="close-example" aria-label="关闭例句卡">${icon("close")}</button><div class="example-sentence"><p>${sentenceHtml(ex)}</p>${state.translationVisible ? `<small>${escapeHtml(ex.l1)}</small>` : ""}</div><div class="example-tools">${iconButton("toggle-example-favorite", "star", "收藏例句", favorite)}<div class="dots" aria-hidden="true">${pkg.examples.map((_,index) => `<i class="${index === state.exampleIndex ? "active" : ""}"></i>`).join("")}</div>${iconButton("play-example", state.playing === "example" ? "pause" : "volume", state.playing === "example" ? "暂停例句音频" : "播放例句音频", state.playing === "example")}</div></div><div class="example-detail">${state.audioError ? `<p class="feedback bad">${escapeHtml(state.audioError)}</p>` : ""}${state.translationVisible ? `<p class="translation-copy">${escapeHtml(ex.l1)}</p>` : `<button class="translation-toggle" type="button" data-action="toggle-translation">查看中文连接</button>`}${state.contextVisible ? `<p class="context-copy"><b>完整上下文</b><br>${escapeHtml(ex.context)}${ex.contextL1 ? `<br><br>${escapeHtml(ex.contextL1)}` : ""}</p>` : ""}<div class="example-detail-actions"><button type="button" data-action="toggle-translation">${state.translationVisible ? "隐藏中文" : "显示中文"}</button><button type="button" data-action="toggle-context">${state.contextVisible ? "收起上下文" : "查看上下文"}</button></div></div></article><div class="swipe-hint">向左滑下一条 · 向右滑上一条</div><div class="example-bottom"><button type="button" data-action="previous-example" ${atFirst ? "disabled" : ""}>上一例句</button><button type="button" data-action="next-example" ${atLast ? "disabled" : ""}>下一例句</button></div><div class="sr-only" aria-live="polite">当前是第 ${state.exampleIndex + 1} 条例句，共 ${pkg.examples.length} 条</div></div>${toastHtml()}</section>`;
    }

    function senseDetailScreen() {
      const pkg = currentPackage();
      const ex = currentExample();
      const mastered = state.mastered.has(pkg.senseId);
      return `<section class="screen scroll utility-screen" aria-label="意思详情">${utilityHead(pkg.lemma)}<div class="utility-body"><div class="lexeme-head"><span class="eyebrow">意思详情 · 浏览不会计入学习</span><h1>${escapeHtml(pkg.lemma)}</h1><div class="pronunciation-row"><button class="audio-pill" type="button" data-action="play-pronunciation">${icon("volume")}${state.accent}</button><span class="ipa">${escapeHtml(pkg.ipa)}</span></div></div><section class="sense-focus"><span class="sense-label">这个意思</span><h2>${escapeHtml(pkg.guide)}</h2></section><article class="bridge-card"><b>中文连接</b><p>${escapeHtml(pkg.bridge)}</p></article><button class="example-inline" type="button" data-action="open-example"><b>${escapeHtml(ex.source)}</b><p>${sentenceHtml(ex)}</p><small>${escapeHtml(ex.l1)}</small><span class="open-example">${icon("expand")}</span></button><div style="margin-top:14px">${mastered ? `<button class="secondary-button" type="button" data-action="master-revoke" data-id="${pkg.senseId}">恢复安排这个意思</button>` : `<button class="secondary-button" type="button" data-action="master-open">标记这个意思已经会了</button>`}</div><p class="plan-note">同一个单词的其他意思拥有独立进度。</p></div>${shellOverlay()}</section>`;
    }

    function finishScreen() {
      const needsSupport = state.finishMode === "needs-support";
      return `<section class="screen finish-screen" aria-label="本次学习完成">${statusbar()}<div class="finish-body"><div class="finish-star">✦</div><h1>${needsSupport ? "这个意思之后还会回来" : "今天的连接建立好了"}</h1><p>${needsSupport ? "这次还没有稳定找回词形，系统会保留真实结果并安排后续巩固。" : "什么时候再出现，由你的记忆状态决定。你不需要管理算法。"}</p><div class="finish-stats"><div><strong>${needsSupport ? 0 : 1}</strong><span>本次完成</span></div><div><strong>${needsSupport ? 1 : 0}</strong><span>需要巩固</span></div><div><strong>${state.mastered.size}</strong><span>标记已会</span></div></div><div class="finish-actions"><button class="primary-button" type="button" data-action="home">回到首页</button><button class="secondary-button" type="button" data-action="start-learning">继续学习</button></div></div>${toastHtml()}</section>`;
    }

    function renderPhone() {
      const phone = document.getElementById("phone");
      if (state.surface === "home") phone.innerHTML = homeScreen();
      else if (state.surface === "books") phone.innerHTML = booksScreen();
      else if (state.surface === "content") phone.innerHTML = contentScreen();
      else if (state.surface === "learning") phone.innerHTML = learningScreen();
      else if (state.surface === "profile") phone.innerHTML = profileScreen();
      else if (state.surface === "study") phone.innerHTML = studyScreen();
      else if (state.surface === "example") phone.innerHTML = exampleScreen();
      else if (state.surface === "sense") phone.innerHTML = senseDetailScreen();
      else if (state.surface === "finish") phone.innerHTML = finishScreen();
      renderInspector();
      if (state.sheet) requestAnimationFrame(() => phone.querySelector(".bottom-sheet .confirm")?.focus());
    }

    function renderInspector() {
      const pkg = currentPackage();
      const example = currentExample();
      const audioAsset = state.surface === "example" ? example.audio : pkg.pronunciationAudio;
      document.getElementById("inspector").innerHTML = `<h1>Sensa V1 · Product Prototype</h1><p>不背单词式 Product Shell × Sensa Sense-first Learning Kernel。此原型验证 IA、视觉层级和状态转换，不写真实 Evidence。</p><h2>快速跳转</h2><div class="jump-grid"><button data-jump="home">首页</button><button data-jump="books">词书</button><button data-jump="content">我的内容</button><button data-jump="learning">我的学习</button><button data-jump="experience">经验态</button><button data-jump="reveal">揭示态</button><button data-jump="example">全屏例句</button><button data-jump="boundary">边界辨析</button><button data-jump="repair">修复</button><button data-jump="cloze">完形</button><button data-jump="master">“熟”确认</button><button data-jump="finish">完成页</button></div><h2>当前状态</h2><div class="state-card"><div class="state-row"><span>Surface</span><b>${state.surface}</b></div><div class="state-row"><span>Study stage</span><b>${state.studyStage}</b></div><div class="state-row"><span>Word / meaning</span><b>${pkg.lemma} · ${pkg.guide}</b></div><div class="state-row"><span>Package</span><b>${pkg.releaseId} · ${pkg.senseId} · ${pkg.validationStatus}</b></div><div class="state-row"><span>Example asset</span><b>${example.id}</b></div><div class="state-row"><span>Audio asset</span><b>${audioAsset.id} · ${audioAsset.durationMs}ms</b></div><div class="state-row"><span>Declared Mastery</span><b>${state.mastered.size ? [...state.mastered].join(", ") : "none"}</b></div><div class="state-row"><span>Visible assets</span><b>${state.studyStage === "experience" ? "experience_sketch only" : state.studyStage === "reveal" ? "action-referenced sketch + bridge + ordered study examples + audio" : "renderer-specific"}</b></div></div><h2>合同检查</h2><div class="contract-note"><strong>真实候选包，不冒充已发布</strong>内容逐字来自 ${pkg.packagePath}；release status 是 ${pkg.releaseStatus}，package validator 是 ${pkg.validationStatus}。</div><div class="contract-note" style="margin-top:9px"><strong>“熟”只针对当前意思</strong>确认后中断/取消这个 Sense 的非终态 Encounter，不产生 Attempt、Evidence 或 Memory Outcome；同词其他意思不受影响。</div><div class="contract-note" style="margin-top:9px"><strong>例句轮播资产边界</strong>原型假定当前 Action 显式按序引用这 3 条 study example；生产端不能从整个 Package 自行补齐。</div><div class="contract-note" style="margin-top:9px"><strong>真实音频</strong>直接读取与 package mediaSha256 对应的本地 MP3，不调用 TTS；生产端仍应通过授权媒体 URL / R2 交付。收藏展示目标体验，但 production 必须先完成 Bookmark schema、语言中立 contract、Sync 与本地 store。</div>`;
    }

    let toastTimer = null;
    function showToast(message) {
      state.toast = message;
      clearTimeout(toastTimer);
      renderPhone();
      toastTimer = setTimeout(() => { state.toast = null; renderPhone(); }, 2300);
    }
    function selectPackage(id) {
      const index = PACKAGES.findIndex(pkg => pkg.senseId === id);
      if (index >= 0) state.packageIndex = index;
      state.exampleIndex = 0;
      state.exampleDirection = null;
    }
    function paginateExample(step) {
      const nextIndex = state.exampleIndex + step;
      const examples = currentPackage().examples;
      if (nextIndex < 0 || nextIndex >= examples.length) return false;
      stopAudio(false);
      state.exampleDirection = step > 0 ? "next" : "previous";
      state.exampleIndex = nextIndex;
      state.translationVisible = false;
      state.contextVisible = false;
      state.playing = null;
      state.audioError = null;
      renderPhone();
      setTimeout(() => { state.exampleDirection = null; }, 320);
      return true;
    }
    function nextEligiblePackageIndex(afterIndex) {
      for (let offset = 1; offset <= PACKAGES.length; offset += 1) {
        const index = (afterIndex + offset + PACKAGES.length) % PACKAGES.length;
        if (!state.mastered.has(PACKAGES[index].senseId)) return index;
      }
      return 0;
    }
    function go(surface) {
      stopAudio(false);
      state.previousSurface = state.surface;
      state.surface = surface;
      state.menuOpen = false;
      state.sheet = null;
      state.audioError = null;
      renderPhone();
    }
    function stopAudio(shouldRender = true) {
      if (activeAudio) {
        activeAudio.pause();
        activeAudio.removeAttribute("src");
        activeAudio.load();
        activeAudio = null;
      }
      state.playing = null;
      if (shouldRender) renderPhone();
    }
    function play(kind) {
      if (activeAudio && state.playing === kind) {
        stopAudio();
        return;
      }
      stopAudio(false);
      const asset = kind === "pronunciation" ? currentPackage().pronunciationAudio : currentExample().audio;
      if (!asset) {
        state.audioError = "当前学习资产没有可用音频。";
        renderPhone();
        return;
      }
      const audio = new Audio(new URL(asset.path, location.href).href);
      activeAudio = audio;
      state.playing = kind;
      state.audioError = null;
      audio.preload = "auto";
      const finish = errorMessage => {
        if (activeAudio !== audio) return;
        activeAudio = null;
        state.playing = null;
        state.audioError = errorMessage || null;
        renderPhone();
      };
      audio.addEventListener("ended", () => finish(null), { once: true });
      audio.addEventListener("error", () => finish("真实音频暂时无法读取，请检查本地媒体文件。"), { once: true });
      renderPhone();
      const started = audio.play();
      if (started && typeof started.catch === "function") started.catch(() => finish("浏览器阻止了音频播放，请再次点击播放。"));
    }
    function failRetrieval() {
      state.clozeResult = null;
      if (state.repairUsed) {
        state.finishMode = "needs-support";
        go("finish");
      } else {
        state.repairUsed = true;
        state.studyStage = "repair";
        renderPhone();
      }
    }
    function jumpTo(target) {
      if (["home","books","content","learning","finish"].includes(target)) {
        go(target);
        return;
      }
      stopAudio(false);
      state.audioError = null;
      state.surface = "study";
      state.studyStage = target === "master" ? "reveal" : target;
      state.boundaryChoice = target === "repair" ? "b" : null;
      state.clozeResult = null;
      state.repairUsed = target === "repair";
      state.sheet = target === "master" ? "mastery" : null;
      if (target === "example") {
        state.previousSurface = "study";
        state.surface = "example";
      }
      renderPhone();
    }

    document.addEventListener("click", event => {
      const jump = event.target.closest("[data-jump]");
      if (jump) {
        jumpTo(jump.dataset.jump);
        return;
      }
      const control = event.target.closest("[data-action]");
      if (!control) return;
      const action = control.dataset.action;
      if (action === "home") go("home");
      else if (action === "nav-books") go("books");
      else if (action === "nav-content") go("content");
      else if (action === "nav-learning") go("learning");
      else if (action === "nav-profile") go("profile");
      else if (action === "start-learning") { state.packageIndex = nextEligiblePackageIndex(-1); state.studyStage = "experience"; state.boundaryChoice = null; state.clozeResult = null; state.repairUsed = false; go("study"); }
      else if (action === "exit-study") { stopAudio(false); state.surface = "home"; state.menuOpen = false; state.sheet = null; state.audioError = null; showToast("已离开；当前意思没有被算作完成"); }
      else if (action === "reveal") { state.studyStage = "reveal"; state.audioError = null; renderPhone(); if (state.autoPronunciation) play("pronunciation"); }
      else if (action === "continue-reveal") { stopAudio(false); const pkg = currentPackage(); state.sessionCompleted += 1; state.packageIndex = nextEligiblePackageIndex(state.packageIndex); state.exampleIndex = 0; state.studyStage = "experience"; state.boundaryChoice = null; state.clozeResult = null; state.repairUsed = false; state.audioError = null; showToast(`已完成 ${pkg.lemma} · ${pkg.guide} 的连接`); }
      else if (action === "toggle-scene") { state.sceneExpanded = !state.sceneExpanded; renderPhone(); }
      else if (action === "play-pronunciation") play("pronunciation");
      else if (action === "play-example") play("example");
      else if (action === "open-example") { stopAudio(false); state.previousSurface = state.surface; state.surface = "example"; state.exampleDirection = null; state.translationVisible = false; state.contextVisible = false; state.audioError = null; renderPhone(); if (state.autoExample) play("example"); }
      else if (action === "close-example") { stopAudio(false); state.surface = state.previousSurface === "sense" ? "sense" : "study"; state.exampleDirection = null; state.audioError = null; renderPhone(); }
      else if (action === "toggle-translation") { state.translationVisible = !state.translationVisible; renderPhone(); }
      else if (action === "toggle-context") { state.contextVisible = !state.contextVisible; renderPhone(); }
      else if (action === "previous-example") paginateExample(-1);
      else if (action === "next-example") paginateExample(1);
      else if (action === "toggle-example-favorite") { const id = currentExample().id; state.exampleFavorites.has(id) ? state.exampleFavorites.delete(id) : state.exampleFavorites.add(id); showToast(state.exampleFavorites.has(id) ? "已收藏这条例句（原型状态）" : "已取消收藏"); }
      else if (action === "toggle-sense-favorite") { const id = currentPackage().senseId; state.senseFavorites.has(id) ? state.senseFavorites.delete(id) : state.senseFavorites.add(id); showToast(state.senseFavorites.has(id) ? "已收藏这个意思（原型状态）" : "已取消收藏"); }
      else if (action === "toggle-menu") { state.menuOpen = !state.menuOpen; renderPhone(); }
      else if (action === "open-preferences") { state.learningTab = "preferences"; go("learning"); }
      else if (action === "master-open") { state.sheet = "mastery"; state.menuOpen = false; renderPhone(); }
      else if (action === "sheet-cancel") { state.sheet = null; renderPhone(); }
      else if (action === "master-confirm") {
        stopAudio(false);
        const pkg = currentPackage();
        const origin = state.surface;
        state.mastered.add(pkg.senseId);
        state.sheet = null;
        if (origin === "study") {
          state.packageIndex = nextEligiblePackageIndex(state.packageIndex);
          state.exampleIndex = 0;
          state.studyStage = "experience";
          state.clozeResult = null;
          state.repairUsed = false;
          state.sessionCompleted += 1;
        }
        showToast(`已标记 ${pkg.lemma} · ${pkg.guide} 为已会`);
      }
      else if (action === "master-revoke") { const id = control.dataset.id; state.mastered.delete(id); showToast("已恢复安排这个意思"); }
      else if (action === "boundary-choice") { state.boundaryChoice = control.dataset.choice; renderPhone(); }
      else if (action === "boundary-continue") { state.studyStage = "cloze"; state.clozeResult = null; state.repairUsed = false; renderPhone(); }
      else if (action === "repair-continue") { state.exampleIndex = (state.exampleIndex + 1) % currentPackage().examples.length; state.studyStage = "cloze"; state.clozeResult = null; state.repairUsed = true; renderPhone(); }
      else if (action === "submit-cloze") { const input = document.getElementById("cloze-answer"); if (!input || !input.value.trim()) { showToast("先输入一个英文词，或选择“不会”"); } else if (input.value.trim().toLocaleLowerCase() === currentPackage().lemma.toLocaleLowerCase()) { state.clozeResult = "correct"; renderPhone(); } else { failRetrieval(); } }
      else if (action === "cloze-giveup") failRetrieval();
      else if (action === "complete-sense") { state.sessionCompleted += 1; state.finishMode = "completed"; go("finish"); }
      else if (action === "open-sense") { selectPackage(control.dataset.id); go("sense"); }
      else if (action === "learning-plan") { state.learningTab = "plan"; renderPhone(); }
      else if (action === "learning-preferences") { state.learningTab = "preferences"; renderPhone(); }
      else if (action === "toggle-pronunciation") { state.autoPronunciation = !state.autoPronunciation; renderPhone(); }
      else if (action === "toggle-example-audio") { state.autoExample = !state.autoExample; renderPhone(); }
      else if (action === "cycle-accent") { state.accent = state.accent === "美式" ? "英式" : "美式"; renderPhone(); }
      else if (action === "pace") { state.dailyTarget = state.dailyTarget === 10 ? 15 : state.dailyTarget === 15 ? 20 : 10; showToast(`每日新学已调整为 ${state.dailyTarget} 个意思`); }
      else if (action === "sync") showToast("学习数据已同步");
      else if (["appearance","feedback","export"].includes(action)) showToast("这是 PRD 中的真实入口；原型不写外部数据");
    });

    document.addEventListener("input", event => {
      if (event.target.id !== "book-search") return;
      state.bookSearch = event.target.value;
      renderPhone();
      const input = document.getElementById("book-search");
      if (input) {
        input.focus();
        input.setSelectionRange(input.value.length, input.value.length);
      }
    });

    let activeExampleSwipe = null;
    document.addEventListener("pointerdown", event => {
      if (state.surface !== "example" || event.target.closest("button")) return;
      const card = event.target.closest("[data-example-swipe]");
      if (!card) return;
      activeExampleSwipe = {
        pointerId: event.pointerId,
        card,
        startX: event.clientX,
        startY: event.clientY,
        startedAt: performance.now(),
        axis: null
      };
      card.classList.add("is-dragging");
      try { card.setPointerCapture(event.pointerId); } catch (_) {}
    });

    document.addEventListener("pointermove", event => {
      const swipe = activeExampleSwipe;
      if (!swipe || swipe.pointerId !== event.pointerId) return;
      const dx = event.clientX - swipe.startX;
      const dy = event.clientY - swipe.startY;
      if (!swipe.axis && Math.max(Math.abs(dx), Math.abs(dy)) > 7) swipe.axis = Math.abs(dx) > Math.abs(dy) ? "x" : "y";
      if (swipe.axis !== "x") return;
      event.preventDefault();
      const atStart = state.exampleIndex === 0 && dx > 0;
      const atEnd = state.exampleIndex === currentPackage().examples.length - 1 && dx < 0;
      const resistance = atStart || atEnd ? .24 : 1;
      const translated = Math.max(-132, Math.min(132, dx * resistance));
      swipe.card.style.transform = `translate3d(${translated}px,0,0) rotate(${translated * .012}deg)`;
      swipe.card.style.opacity = String(Math.max(.68, 1 - Math.abs(translated) / 430));
    }, { passive: false });

    function finishExampleSwipe(event, cancelled = false) {
      const swipe = activeExampleSwipe;
      if (!swipe || swipe.pointerId !== event.pointerId) return;
      const dx = event.clientX - swipe.startX;
      const elapsed = Math.max(1, performance.now() - swipe.startedAt);
      const speed = Math.abs(dx) / elapsed;
      const step = dx < 0 ? 1 : -1;
      const nextIndex = state.exampleIndex + step;
      const inBounds = nextIndex >= 0 && nextIndex < currentPackage().examples.length;
      const commit = !cancelled && swipe.axis === "x" && inBounds && (Math.abs(dx) >= 64 || speed >= .48);
      swipe.card.classList.remove("is-dragging");
      swipe.card.style.transition = "transform 170ms var(--ease-in-out), opacity 150ms ease";
      if (commit) {
        swipe.card.style.transform = `translate3d(${step > 0 ? -430 : 430}px,0,0)`;
        swipe.card.style.opacity = ".2";
        setTimeout(() => paginateExample(step), 145);
      } else {
        swipe.card.style.transform = "translate3d(0,0,0)";
        swipe.card.style.opacity = "1";
        setTimeout(() => {
          swipe.card.style.removeProperty("transition");
          swipe.card.style.removeProperty("transform");
          swipe.card.style.removeProperty("opacity");
        }, 190);
      }
      activeExampleSwipe = null;
    }

    document.addEventListener("pointerup", event => finishExampleSwipe(event));
    document.addEventListener("pointercancel", event => finishExampleSwipe(event, true));

    document.addEventListener("keydown", event => {
      if (state.surface === "example" && event.key === "ArrowLeft") {
        event.preventDefault();
        paginateExample(-1);
        return;
      }
      if (state.surface === "example" && event.key === "ArrowRight") {
        event.preventDefault();
        paginateExample(1);
        return;
      }
      if (event.key !== "Escape") return;
      if (state.sheet) {
        state.sheet = null;
        renderPhone();
      } else if (state.surface === "example") {
        stopAudio(false);
        state.audioError = null;
        state.surface = state.previousSurface === "sense" ? "sense" : "study";
        renderPhone();
      }
    });

    const initialJump = location.hash.slice(1);
    if (["home","books","content","learning","experience","reveal","example","boundary","repair","cloze","master","finish"].includes(initialJump)) jumpTo(initialJump);
    else renderPhone();
  </script>
</body>
</html>
