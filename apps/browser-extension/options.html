<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title data-i18n="optionsTitle"></title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f6f7fa;color:#242a38;font:15px/1.6 system-ui}main{max-width:900px;margin:36px auto;padding:0 24px}h1{font-size:30px}h2{font-size:20px}section,fieldset{background:white;border:1px solid #d9deea;border-radius:14px;padding:20px;margin:20px 0}fieldset{min-width:0}label{display:block;margin:12px 0}input,select,textarea,button{font:inherit;padding:10px;border:1px solid #b6bfd2;border-radius:8px}input,select,textarea{width:100%;background:white}input[type=checkbox]{width:auto}button{cursor:pointer;background:white;color:#303f76;min-height:44px;margin:4px 8px 4px 0}button.primary{background:#303f76;color:white}button:disabled{opacity:.6;cursor:wait}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #627cce}p{overflow-wrap:anywhere}.muted{color:#627087;font-size:13px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:0 20px}[role=status]{white-space:pre-wrap}footer{position:sticky;bottom:0;padding:12px 0;background:#f6f7fa}summary{cursor:pointer}
</style><main><h1 data-i18n="optionsHeading"></h1><p data-i18n="optionsIntro"></p><p id="feedback" role="status" data-i18n="optionsReading"></p>
<section><h2 data-i18n="optionsService"></h2><p id="service-status" role="status" data-i18n="optionsChecking"></p><button id="account" data-i18n="optionsAccount"></button><button id="service-reload" data-i18n="optionsRefresh"></button></section><details id="advanced"><summary data-i18n="optionsAdvanced"></summary><section><h2 data-i18n="optionsConnections"></h2><p class="muted" data-i18n="optionsKeyNotice"></p><p id="origins" class="muted"></p><div id="providers"></div><button id="add" data-i18n="optionsAdd"></button></section>
<section><h2 data-i18n="optionsAssignments"></h2><div id="assignments" class="grid"></div><p class="muted" data-i18n="optionsDefaultHint"></p></section>
<footer><button id="save" class="primary" data-i18n="optionsSaveModel"></button><button id="reload" data-i18n="optionsReloadAdvanced"></button></footer></details><section><h2 data-i18n="optionsLocalPrefs"></h2><label><span data-i18n="optionsActionName"></span><input id="action-name" maxlength="24"></label><label><span data-i18n="optionsActionPrompt"></span><textarea id="action-prompt" maxlength="2000" rows="3"></textarea></label><label><span data-i18n="optionsDisabledSites"></span><textarea id="disabled-sites" rows="3" placeholder="example.com"></textarea></label><label><span data-i18n="optionsSpeechRate"></span><input id="speech-rate" type="number" min="0.5" max="2" step="0.1" value="1"></label>
<label><span data-i18n="optionsSpeechVoice"></span><select id="speech-voice"><option value=""></option></select></label><p class="muted"><strong data-i18n="optionsShortcuts"></strong>: <span data-i18n="optionsShortcutHint"></span></p><button id="preferences" data-i18n="optionsSavePrefs"></button></section>
</main><script src="options.js"></script></html>
