<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<title>Sensa 阅读采集</title>
<style>
  [hidden]{display:none!important}
  body{box-sizing:border-box;width:352px;margin:0;padding:16px;font:14px/1.6 system-ui;color:#242a38;background:#fbfbfa}
  h1{font-size:24px;line-height:1.3;margin:0 0 12px}
  button,a{display:block;box-sizing:border-box;min-height:44px;padding:8px;width:100%;color:#242a38}
  button{margin:6px 0;background:white;border:1px solid #bec5d5;border-radius:10px;cursor:pointer;font:inherit}
  p{overflow-wrap:anywhere;white-space:pre-line;margin:0 0 12px}
  button.primary{background:#445780;border-color:#445780;color:white;font-weight:600}
  summary{padding:10px;border:1px solid #bec5d5;border-radius:10px;cursor:pointer}
  button:hover{background:#edf0f7}
  button.primary:hover{background:#35476d}
  button:active{background:#edf0f7}
  button:disabled{opacity:.6;cursor:wait}
  button:focus-visible,a:focus-visible,#recent:focus-visible{outline:3px solid #303f76;outline-offset:-3px}
  .saved{margin:16px 0 12px;border:1px solid #d8dce6;border-radius:12px;overflow:hidden;background:white}
  .saved header{display:flex;align-items:center;justify-content:space-between;padding:10px 12px;border-bottom:1px solid #e7e9ef}
  .saved h2{font-size:14px;margin:0}
  #recent-count{font-size:12px;color:#68748d}
  #recent{max-height:128px;overflow-y:auto;overscroll-behavior:contain;scrollbar-gutter:stable}
  #recent a{padding:10px 12px;overflow-wrap:anywhere;text-decoration:none;border-bottom:1px solid #edf0f5}
  #recent a:last-child{border-bottom:0}
  #recent a:hover{background:#edf0f7}
  #recent-empty{padding:12px;margin:0;color:#68748d}
  small{display:block;color:#68748d}
</style>
<h1>Sensa</h1>
<p id="status" role="status" data-i18n="checking"></p>
<button id="toggle" class="primary" data-i18n="reading"></button>
<button id="open-web" data-i18n="open"></button>
<button id="login" data-i18n="login"></button>
<button id="options" data-i18n="options"></button>
<section class="saved" aria-labelledby="recent-title">
  <header><h2 id="recent-title" data-i18n="recent"></h2><span id="recent-count"></span></header>
  <div id="recent" role="region" aria-labelledby="recent-title" tabindex="0"></div>
  <p id="recent-empty"></p>
</section>
<button id="sync" data-i18n="sync"></button>
<details><summary data-i18n="advanced"></summary>
<button id="stop" data-i18n="stop"></button>
<button id="disconnect" data-i18n="disconnect"></button>
</details>
<script src="popup.js"></script>
</html>
