name: Initialize isolated Sensa trial database
on:
  workflow_dispatch:
    inputs:
      operation:
        description: Initialize database or admit one already verified test account
        type: choice
        options: [initialize, invite]
        default: initialize
        required: true
      auth_subject:
        description: Verified Supabase Auth user UUID (invite operation only)
        required: false
      release_sha:
        description: Full reviewed commit SHA to initialize from
        required: true
      owner_authorized:
        description: Owner authorizes this operation in the isolated test project
        type: boolean
        required: true
        default: false
permissions:
  contents: read
concurrency:
  group: sensa-trial-database
  cancel-in-progress: false
jobs:
  initialize:
    if: inputs.owner_authorized
    environment: sensa-trial
    runs-on: ubuntu-latest
    env:
      SUPABASE_PROJECT_REF: kwwmukqzlxxsnviyhwmr
      NODE_EXTRA_CA_CERTS: ${{ github.workspace }}/infra/certs/supabase-prod-ca-2021.crt
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_sha }}
      - name: Verify reviewed revision
        env:
          REVIEWED_SHA: ${{ inputs.release_sha }}
        run: |
          node --input-type=module <<'JS'
          import {execFileSync} from 'node:child_process';
          if(!/^[a-f0-9]{40}$/.test(process.env.REVIEWED_SHA??'')||execFileSync('git',['rev-parse','HEAD'],{encoding:'utf8'}).trim()!==process.env.REVIEWED_SHA)throw Error('Reviewed full SHA required');
          JS
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Initialize migrations and restricted runtime only
        if: inputs.operation == 'initialize'
        env:
          MIGRATION_DATABASE_URL: ${{ secrets.MIGRATION_DATABASE_URL }}
          SENSA_RUNTIME_DATABASE_URL: ${{ secrets.SENSA_RUNTIME_DATABASE_URL }}
        run: node scripts/release/trialDatabase.mjs --apply
      - name: Admit one verified identity without restoring revoked access
        if: inputs.operation == 'invite'
        env:
          MIGRATION_DATABASE_URL: ${{ secrets.MIGRATION_DATABASE_URL }}
          SENSA_RUNTIME_DATABASE_URL: ${{ secrets.SENSA_RUNTIME_DATABASE_URL }}
          SENSA_TRIAL_AUTH_SUBJECT: ${{ inputs.auth_subject }}
        run: node scripts/release/trialDatabase.mjs --invite
