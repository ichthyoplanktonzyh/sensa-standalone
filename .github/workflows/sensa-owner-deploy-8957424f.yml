name: Owner-authorized release 8957424f (CI repair deferred)
run-name: Owner-authorized production release 8957424f, tests explicitly waived
on:
  workflow_dispatch:
    inputs:
      owner_accepted:
        description: Execute the owner's 2026-10-18 instruction to deploy this exact revision before CI repair
        type: boolean
        required: true
        default: false
permissions:
  contents: read
  actions: read
concurrency:
  group: sensa-production
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: web-candidate
    outputs:
      release_id: ${{ steps.plan.outputs.release_id }}
      artifact_id: ${{ steps.candidate.outputs.artifact-id }}
    env:
      SENSA_RELEASE_SHA: 8957424f3bec65d1fdcf9d5219f6165e58f5ab80
      VITE_SENSA_MODE: production
      SENSA_WEB_ORIGIN: ${{ vars.SENSA_WEB_ORIGIN }}
      VITE_SENSA_SUPPORT_URL: ${{ vars.SENSA_SUPPORT_URL }}
      VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
      VITE_SENSA_API_URL: ${{ vars.VITE_SENSA_API_URL }}
      SENSA_EXTENSION_WEB_URL: ${{ vars.SENSA_WEB_ORIGIN }}
      SENSA_EXTENSION_API_URL: ${{ vars.VITE_SENSA_API_URL }}
    steps:
      - name: Require the explicit one-revision owner exception
        if: ${{ !inputs.owner_accepted }}
        run: exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 8957424f3bec65d1fdcf9d5219f6165e58f5ab80
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Build and seal the exact production source without claiming green tests
        run: |
          node scripts/release/releaseCandidate.mjs --check
          npm run build
          node scripts/release/releaseCandidate.mjs
          node scripts/release/verifyCandidate.mjs
          npx wrangler versions upload --dry-run --strict
      - name: Restore the previous successful production baseline
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release/releaseArchive.mjs baseline
      - name: Plan the existing Application then full Content release
        id: plan
        env:
          SENSA_RELEASE_MODE: manual
          SENSA_RELEASE_SCOPE: auto
          SENSA_MEDIA_RELEASE_TAG: sensa-learning-media-9715ebcdf2b4
          SENSA_MEDIA_PACK_SHA256: 9715ebcdf2b416e1e66a743a4f5c0e0c3ba4278ec2396f16d42328e96749c7e6
          SENSA_SYSTEM_RELEASE_ID: sensa-system-8957424f3bec-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          node scripts/release/systemRelease.mjs plan
          node --input-type=module <<'JS'
          import {readFileSync,writeFileSync} from 'node:fs';
          const plan=JSON.parse(readFileSync('release-candidate/system-release-plan.json','utf8'));
          if(plan.source.commit!==process.env.SENSA_RELEASE_SHA||plan.decision.applicationMode!=='full'||!plan.decision.deployApplication||!plan.decision.publishLearningContent)throw Error('One-off release scope changed');
          writeFileSync('release-candidate/owner-ci-exception.json',JSON.stringify({format:'sensa-owner-authorized-ci-exception-v1',commit:process.env.SENSA_RELEASE_SHA,releaseId:plan.releaseId,recordedAt:new Date().toISOString(),authority:'Owner explicitly requested immediate deployment and deferred CI repair on 2026-10-18',ciPassed:false,ciGateWaived:true,failedValidationRun:'https://github.com/ichthyoplanktonzyh/sensa-standalone/actions/runs/39100640860',knownFailures:['Synthetic 10k World fixture preparation hook exceeded 120 seconds','World preparation status locator matched two status elements','World graph test did not become ready after controlled animation-frame restoration'],build:{workflowRunId:process.env.GITHUB_RUN_ID,attempt:process.env.GITHUB_RUN_ATTEMPT,workflow:'Owner-authorized release 8957424f (CI repair deferred)'},standardGreenCiSystemManifestCreated:false},null,2)+'\n');
          JS
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: sensa-release-plan-${{ steps.plan.outputs.release_id }}
          retention-days: 30
          if-no-files-found: error
          path: |
            release-candidate/system-release-plan.json
            release-candidate/owner-ci-exception.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        id: candidate
        with:
          name: sensa-owner-candidate-8957424f-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 30
          if-no-files-found: error
          path: |
            apps/web/dist/
            apps/browser-extension/dist/
            apps/api/dist/
            packages/contracts/dist/
            packages/learning-kernel/dist/
            packages/content-validator/dist/
            packages/model-runtime/dist/
            packages/mcp-server/dist/
            release-candidate/manifest.json
  application:
    needs: prepare
    uses: ./.github/workflows/sensa-web-deploy.yml
    with:
      release_sha: 8957424f3bec65d1fdcf9d5219f6165e58f5ab80
      candidate_run_id: ${{ github.run_id }}
      candidate_run_attempt: ${{ github.run_attempt }}
      candidate_artifact_id: ${{ needs.prepare.outputs.artifact_id }}
      candidate_validation_attempt: owner-waived
      release_id: ${{ needs.prepare.outputs.release_id }}
      application_mode: full
    secrets: inherit
  learning_content:
    needs: [prepare, application]
    uses: ./.github/workflows/sensa-learning-content-publish.yml
    with:
      release_sha: 8957424f3bec65d1fdcf9d5219f6165e58f5ab80
      media_release_tag: sensa-learning-media-9715ebcdf2b4
      media_pack_sha256: 9715ebcdf2b416e1e66a743a4f5c0e0c3ba4278ec2396f16d42328e96749c7e6
      release_id: ${{ needs.prepare.outputs.release_id }}
    secrets: inherit
  record_exception:
    needs: [prepare, application, learning_content]
    if: ${{ always() && needs.prepare.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: sensa-release-plan-${{ needs.prepare.outputs.release_id }}
          path: evidence/plan
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        if: ${{ needs.application.result == 'success' }}
        with:
          artifact-ids: ${{ needs.application.outputs.evidence_artifact_id }}
          path: evidence/application
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        if: ${{ needs.learning_content.result == 'success' }}
        with:
          artifact-ids: ${{ needs.learning_content.outputs.evidence_artifact_id }}
          path: evidence/content
      - name: Record actual outcomes and the explicit test exception
        env:
          COMPONENT_JOBS: ${{ toJSON(needs) }}
        run: |
          node --input-type=module <<'JS'
          import {writeFileSync} from 'node:fs';
          const jobs=JSON.parse(process.env.COMPONENT_JOBS),verified=jobs.application.result==='success'&&jobs.learning_content.result==='success';
          writeFileSync('evidence/owner-deployment-outcome.json',JSON.stringify({format:'sensa-owner-deployment-outcome-v1',commit:'8957424f3bec65d1fdcf9d5219f6165e58f5ab80',observedAt:new Date().toISOString(),workflowRunId:process.env.GITHUB_RUN_ID,workflowRunAttempt:process.env.GITHUB_RUN_ATTEMPT,status:verified?'components-verified-with-owner-ci-exception':'partial-or-unverified',ciPassed:false,ciGateWaived:true,standardGreenCiSystemManifestCreated:false,jobs},null,2)+'\n');
          JS
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: sensa-owner-deployment-proof-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 30
          if-no-files-found: error
          path: evidence/
      - name: Require actual deployment and content publication success
        if: ${{ needs.application.result != 'success' || needs.learning_content.result != 'success' }}
        run: exit 1
