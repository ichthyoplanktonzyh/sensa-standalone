name: Sensa CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: sensa-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
env:
  SENSA_EXTENSION_WEB_URL: http://127.0.0.1:3001
  SENSA_EXTENSION_API_URL: http://127.0.0.1:4319
  VITE_SENSA_MODE: production
  VITE_SUPABASE_URL: http://127.0.0.1:4319
  VITE_SUPABASE_PUBLISHABLE_KEY: local-browser-test-key
  VITE_SENSA_API_URL: http://127.0.0.1:4319
jobs:
  static-smoke:
    name: Static, build and fast smoke
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment: web-candidate
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.x
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Build pull-request validation surface
        if: ${{ github.event_name == 'pull_request' }}
        run: npm run build
      - name: Build, seal and verify the main release candidate
        if: ${{ github.event_name == 'push' }}
        env:
          SENSA_RELEASE_SHA: ${{ github.sha }}
          SENSA_WEB_ORIGIN: ${{ vars.SENSA_WEB_ORIGIN }}
          VITE_SENSA_SUPPORT_URL: ${{ vars.SENSA_SUPPORT_URL }}
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_SENSA_API_URL: ${{ vars.VITE_SENSA_API_URL }}
          SENSA_EXTENSION_WEB_URL: ${{ vars.SENSA_WEB_ORIGIN }}
          SENSA_EXTENSION_API_URL: ${{ vars.VITE_SENSA_API_URL }}
        run: |
          node scripts/release/releaseCandidate.mjs --check
          npm run build
          node scripts/release/releaseCandidate.mjs
          node scripts/release/verifyCandidate.mjs
          npx wrangler versions upload --dry-run --strict
      - name: Edge compile check
        run: npm run test:edge
      - name: Fast production-path smoke suite
        run: npm test
      - name: Preserve native fast-test reports and exact selection
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: sensa-fast-report-attempt-${{ github.run_attempt }}
          path: .tmp/test-results/fast/
          if-no-files-found: warn
          retention-days: 7
      - name: Preserve the tested main release candidate
        if: ${{ github.event_name == 'push' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sensa-production-${{ github.sha }}-attempt-${{ github.run_attempt }}
          retention-days: 14
          if-no-files-found: error
          path: |
            apps/web/dist/
            apps/browser-extension/dist/
            apps/api/dist/
            packages/contracts/dist/
            packages/learning-kernel/dist/
            packages/content-validator/dist/
            packages/model-runtime/dist/
            packages/mcp-server/dist/
            release-candidate/manifest.json

  browser-shards:
    name: Chromium integration shard ${{ matrix.shard }}/3
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    # Full journey coverage includes isolated production builds, genuine
    # history generators and OPFS lifecycle fixtures; spec interaction budgets
    # remain independent and unchanged.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Build browser test workspace dependencies
        run: |
          npm run build -w @sensa/learning-kernel
          npm run build -w @sensa/contracts
          npm run build -w @sensa/content-validator
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Select browser validation depth and exact capacity preparation
        id: browser-selection
        env:
          BROWSER_DEPTH: ${{ github.event_name == 'push' && 'full' || 'quick' }}
        run: |
          mkdir -p .tmp
          node --import tsx tests/web/run.mts --suite=browser --depth="$BROWSER_DEPTH" --shard=${{ matrix.shard }}/3 --list > .tmp/browser-selection.txt
          echo "depth=$BROWSER_DEPTH" >> "$GITHUB_OUTPUT"
          if rg -q '^retention-review-capacity \|' .tmp/browser-selection.txt; then
            echo 'retention=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Fingerprint formal history fixture dependencies
        id: retention-key
        if: steps.browser-selection.outputs.retention == 'true'
        run: node --import tsx scripts/prepareRetentionCapacity.mts --key --targets=1000 >> "$GITHUB_OUTPUT"
      - name: Restore exact-version synthetic history data
        if: steps.browser-selection.outputs.retention == 'true'
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          key: sensa-retention-${{ runner.os }}-${{ steps.retention-key.outputs.key }}
          path: ${{ steps.retention-key.outputs.directory }}
      - name: Validate cached facts or generate genuine history
        if: steps.browser-selection.outputs.retention == 'true'
        timeout-minutes: 15
        env:
          SENSA_TEST_MEMORY_LIBRARY: 'true'
        run: node --import tsx scripts/prepareRetentionCapacity.mts --prepare --targets=1000
      - name: Isolated Book scale benchmark before large journey fixtures
        id: book-scale-performance
        if: ${{ matrix.shard == 2 && steps.browser-selection.outputs.depth == 'full' }}
        continue-on-error: true
        run: npx playwright test tests/web/browser/package-center-journey.spec.ts --grep @book-scale-performance --output .tmp/playwright-book-scale-performance
      - name: Preserve advisory Book scale evidence
        if: ${{ always() && matrix.shard == 2 && steps.browser-selection.outputs.depth == 'full' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sensa-book-scale-performance
          path: .tmp/playwright-book-scale-performance/
          if-no-files-found: warn
          retention-days: 7
      - name: Report advisory Book scale failure
        if: ${{ steps.book-scale-performance.outcome == 'failure' }}
        run: echo '::warning::The 4x CPU Book scale benchmark failed. See sensa-book-scale-performance evidence; this sample does not meet its performance target. Functional journey checks remain required.'
      - name: Browser integration and OPFS durability
        env:
          SENSA_SKIP_BOOK_SCALE_BENCHMARK: 'true'
          SENSA_RETENTION_CAPACITY_FIXTURE: ${{ steps.retention-key.outputs.directory }}
        run: npm run test:browser -- --depth=${{ steps.browser-selection.outputs.depth }} --shard=${{ matrix.shard }}/3
      - name: Preserve native browser reports for every shard attempt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: sensa-browser-report-${{ matrix.shard }}-attempt-${{ github.run_attempt }}
          path: .tmp/test-results/browser/
          if-no-files-found: warn
          retention-days: 7
      - name: Upload synthetic Playwright Test failure evidence
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sensa-playwright-failure-${{ matrix.shard }}-attempt-${{ github.run_attempt }}
          path: .tmp/playwright-results/
          if-no-files-found: ignore
          retention-days: 7

  browser-integration:
    name: Chromium production integration
    needs: browser-shards
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Restore native reports including earlier successful shards on a partial rerun
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: sensa-browser-report-*
          path: .tmp/browser-native-reports
      - name: Merge native Playwright reports without erasing earlier failed attempts
        run: |
          node --input-type=module <<'JS'
          import {readdir,mkdir,copyFile} from 'node:fs/promises';
          import {basename} from 'node:path';
          const visit=async root=>(await Promise.all((await readdir(root,{withFileTypes:true})).map(entry=>entry.isDirectory()?visit(root+'/'+entry.name):root+'/'+entry.name))).flat();
          await mkdir('.tmp/browser-blob-reports',{recursive:true});
          const blobs=(await visit('.tmp/browser-native-reports')).filter(path=>path.endsWith('.zip'));
          if(!blobs.length)throw Error('Native browser report evidence is missing');
          const names=new Set();
          for(const path of blobs){const name=basename(path);if(names.has(name))throw Error('Ambiguous browser blob name');names.add(name);await copyFile(path,'.tmp/browser-blob-reports/'+name);}
          JS
          npx playwright merge-reports --reporter=html .tmp/browser-blob-reports
      - name: Preserve merged browser report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: sensa-browser-merged-attempt-${{ github.run_attempt }}
          path: playwright-report/
          if-no-files-found: warn
          retention-days: 7
      - name: Require every browser shard to pass
        if: always()
        env:
          SHARD_RESULT: ${{ needs.browser-shards.result }}
        run: test "$SHARD_RESULT" = success

  database-integration:
    name: PostgreSQL and API integration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: local-ci-only
          POSTGRES_DB: sensa_m1a_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:local-ci-only@127.0.0.1:5432/sensa_m1a_ci
      SENSA_TEST_DATABASE_URL: postgresql://sensa_ci_test:local-test-only@127.0.0.1:5432/sensa_m1a_ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.x
      - run: npm ci
      - run: npm run build:api
      - run: npm run db:migrate
      - name: Create restricted test principal
        run: |
          node --input-type=module <<'JS'
          import pg from 'pg';
          const client=new pg.Client({connectionString:process.env.DATABASE_URL});
          await client.connect();
          await client.query("CREATE ROLE sensa_ci_test LOGIN PASSWORD 'local-test-only'; GRANT backend_app TO sensa_ci_test; GRANT INSERT, UPDATE ON sensa_consumer.invitations TO sensa_ci_test;");
          await client.end();
          JS
      - name: Install Chromium for database integration
        run: npx playwright install --with-deps chromium
      - name: Node and browser database integration
        env:
          SENSA_FIXTURE_DATABASE_URL: ${{ env.DATABASE_URL }}
          SENSA_ADMIN_TEST_DATABASE_URL: ${{ env.DATABASE_URL }}
        run: npm run test:db
      - name: Preserve native database-test reports and exact selection
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: sensa-database-report-attempt-${{ github.run_attempt }}
          path: .tmp/test-results/database/
          if-no-files-found: warn
          retention-days: 7
