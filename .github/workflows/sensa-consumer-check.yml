name: Sensa CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: sensa-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
env:
  SENSA_EXTENSION_WEB_URL: http://127.0.0.1:3001
  SENSA_EXTENSION_API_URL: http://127.0.0.1:4319
  VITE_SENSA_MODE: production
  VITE_SUPABASE_URL: http://127.0.0.1:4319
  VITE_SUPABASE_PUBLISHABLE_KEY: local-browser-test-key
  VITE_SENSA_API_URL: http://127.0.0.1:4319
jobs:
  static-smoke:
    name: Static, build and fast smoke
    runs-on: ubuntu-latest
    timeout-minutes: 18
    environment: web-candidate
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.x
      - run: npm ci
      - name: Check all test inventory boundaries before building
        run: node --import tsx tests/web/run.mts --ci=node --list
      - name: Typecheck
        run: npm run typecheck
      - name: Build pull-request validation surface
        if: ${{ github.event_name == 'pull_request' }}
        run: npm run build
      - name: Build, seal and verify the main release candidate
        if: ${{ github.event_name == 'push' }}
        env:
          SENSA_RELEASE_SHA: ${{ github.sha }}
          SENSA_WEB_ORIGIN: ${{ vars.SENSA_WEB_ORIGIN }}
          VITE_SENSA_SUPPORT_URL: ${{ vars.SENSA_SUPPORT_URL }}
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_SENSA_API_URL: ${{ vars.VITE_SENSA_API_URL }}
          SENSA_EXTENSION_WEB_URL: ${{ vars.SENSA_WEB_ORIGIN }}
          SENSA_EXTENSION_API_URL: ${{ vars.VITE_SENSA_API_URL }}
        run: |
          node scripts/release/releaseCandidate.mjs --check
          npm run build
          node scripts/release/releaseCandidate.mjs
          node scripts/release/verifyCandidate.mjs
          npx wrangler versions upload --dry-run --strict
      - name: Edge compile check
        run: npm run test:edge
      - name: Fixed Node smoke gate
        run: npm test
      - name: Preserve native fast-test reports and exact selection
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: sensa-fast-report-attempt-${{ github.run_attempt }}
          path: .tmp/test-results/ci-node/
          if-no-files-found: warn
          retention-days: 7
      - name: Preserve the tested main release candidate
        if: ${{ github.event_name == 'push' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sensa-production-${{ github.sha }}-attempt-${{ github.run_attempt }}
          retention-days: 14
          if-no-files-found: error
          path: |
            apps/web/dist/
            apps/browser-extension/dist/
            apps/api/dist/
            packages/contracts/dist/
            packages/learning-kernel/dist/
            packages/content-validator/dist/
            packages/model-runtime/dist/
            packages/mcp-server/dist/
            release-candidate/manifest.json

  database-integration:
    name: Core PostgreSQL and browser smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: local-ci-only
          POSTGRES_DB: sensa_m1a_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:local-ci-only@127.0.0.1:5432/sensa_m1a_ci
      SENSA_TEST_DATABASE_URL: postgresql://sensa_ci_test:local-test-only@127.0.0.1:5432/sensa_m1a_ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.x
      - run: npm ci
      - run: npm run build:api
      - run: npm run db:migrate
      - name: Create restricted test principal
        run: |
          node --input-type=module <<'JS'
          import pg from 'pg';
          const client=new pg.Client({connectionString:process.env.DATABASE_URL});
          await client.connect();
          await client.query("CREATE ROLE sensa_ci_test LOGIN PASSWORD 'local-test-only'; GRANT backend_app TO sensa_ci_test; GRANT INSERT, UPDATE ON sensa_consumer.invitations TO sensa_ci_test;");
          await client.end();
          JS
      - name: Install Chromium for database integration
        run: npx playwright install --with-deps chromium
      - name: Fixed PostgreSQL gate
        env:
          SENSA_FIXTURE_DATABASE_URL: ${{ env.DATABASE_URL }}
          SENSA_ADMIN_TEST_DATABASE_URL: ${{ env.DATABASE_URL }}
        run: npm run test:ci:postgres
      - name: Four production Web smoke cases
        env:
          SENSA_FIXTURE_DATABASE_URL: ${{ env.DATABASE_URL }}
          SENSA_ADMIN_TEST_DATABASE_URL: ${{ env.DATABASE_URL }}
        run: npm run test:ci:e2e
      - name: Preserve native database-test reports and exact selection
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: sensa-database-report-attempt-${{ github.run_attempt }}
          path: |
            .tmp/test-results/ci-postgres/
            .tmp/test-results/ci-e2e/
          if-no-files-found: warn
          retention-days: 7
      - name: Preserve browser failure evidence
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: sensa-core-browser-failure-attempt-${{ github.run_attempt }}
          path: .tmp/playwright-results/
          if-no-files-found: ignore
          retention-days: 7
