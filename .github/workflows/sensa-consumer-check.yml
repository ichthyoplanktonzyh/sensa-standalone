name: Sensa CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: sensa-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
env:
  SENSA_EXTENSION_WEB_URL: http://127.0.0.1:3001
  VITE_SENSA_MODE: production
  VITE_SUPABASE_URL: http://127.0.0.1:4319
  VITE_SUPABASE_PUBLISHABLE_KEY: local-browser-test-key
  VITE_SENSA_API_URL: http://127.0.0.1:4319
jobs:
  static-smoke:
    name: Static, build and fast smoke
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.x
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: Edge compile check
        run: npm run test:edge
      - name: Fast production-path smoke suite
        run: npm test

  database-integration:
    name: PostgreSQL and API integration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: local-ci-only
          POSTGRES_DB: sensa_m1a_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:local-ci-only@127.0.0.1:5432/sensa_m1a_ci
      SENSA_TEST_DATABASE_URL: postgresql://sensa_ci_test:local-test-only@127.0.0.1:5432/sensa_m1a_ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.x
      - run: npm ci
      - run: npm run build:api
      - run: npm run db:migrate
      - name: Create restricted test principal
        run: |
          node --input-type=module <<'JS'
          import pg from 'pg';
          const client=new pg.Client({connectionString:process.env.DATABASE_URL});
          await client.connect();
          await client.query("CREATE ROLE sensa_ci_test LOGIN PASSWORD 'local-test-only'; GRANT backend_app TO sensa_ci_test; GRANT INSERT, UPDATE ON sensa_consumer.invitations TO sensa_ci_test;");
          await client.end();
          JS
      - name: Install Chromium for database integration
        run: npx playwright install --with-deps chromium
      - name: Node and browser database integration
        env:
          SENSA_FIXTURE_DATABASE_URL: ${{ env.DATABASE_URL }}
          SENSA_ADMIN_TEST_DATABASE_URL: ${{ env.DATABASE_URL }}
        run: npm run test:db
      - name: Edge API protocol
        run: deno run --allow-env --allow-net --allow-read --allow-sys --config supabase/functions/sensa-api/deno.json scripts/sensaConsumerAccountSmoke.mts --targets --initial --retention --checkin --intake --semantic --provisioning
      - name: Validate opt-in provider inputs without calls
        run: node --import tsx scripts/sensaRealProviderTrial.mts --validate
