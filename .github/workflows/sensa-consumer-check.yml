name: Sensa consumer checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  account:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: local-ci-only
          POSTGRES_DB: sensa_m1a_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      VITE_SENSA_MODE: production
      DATABASE_URL: postgresql://postgres:local-ci-only@127.0.0.1:5432/sensa_m1a_ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: npm ci
      - run: npm ci --prefix apps/web-next
      - run: npm run typecheck && npm run build && npm run lint
      - run: npm run db:migrate
      - name: Restricted test principal (disposable CI database only)
        run: |
          node --input-type=module <<'JS'
          import pg from 'pg';
          const client=new pg.Client({connectionString:process.env.DATABASE_URL});
          await client.connect();
          await client.query("CREATE ROLE sensa_ci_test LOGIN PASSWORD 'local-test-only'; GRANT backend_app TO sensa_ci_test; GRANT INSERT, UPDATE ON sensa_consumer.invitations TO sensa_ci_test;");
          await client.end();
          JS
      - run: npm run sensa:consumer-account-smoke
        env:
          SENSA_TEST_DATABASE_URL: postgresql://sensa_ci_test:local-test-only@127.0.0.1:5432/sensa_m1a_ci
      - run: npm run sensa:edge-check
      - run: deno run --allow-env --allow-net --allow-read --allow-sys --config supabase/functions/sensa-api/deno.json scripts/sensaConsumerAccountSmoke.mts
        env:
          SENSA_TEST_DATABASE_URL: postgresql://sensa_ci_test:local-test-only@127.0.0.1:5432/sensa_m1a_ci
