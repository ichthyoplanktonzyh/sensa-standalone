name: Sensa consumer checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  account:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: local-ci-only
          POSTGRES_DB: sensa_m1a_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      SENSA_EXTENSION_LEGACY_WEB: '1'
      SENSA_EXTENSION_WEB_URL: http://127.0.0.1:3001
      VITE_SENSA_MODE: legacy-account
      # Compile the authenticated UI too; these are synthetic loopback test values.
      VITE_SUPABASE_URL: http://127.0.0.1:4319
      VITE_SUPABASE_PUBLISHABLE_KEY: local-browser-test-key
      VITE_SENSA_API_URL: http://127.0.0.1:4319
      DATABASE_URL: postgresql://postgres:local-ci-only@127.0.0.1:5432/sensa_m1a_ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: npm ci
      - run: npm ci --prefix apps/web-next
      - run: npm run typecheck && npm run build && npm run lint
      - run: npm run db:migrate
      - name: Restricted test principal (disposable CI database only)
        run: |
          node --input-type=module <<'JS'
          import pg from 'pg';
          const client=new pg.Client({connectionString:process.env.DATABASE_URL});
          await client.connect();
          await client.query("CREATE ROLE sensa_ci_test LOGIN PASSWORD 'local-test-only'; GRANT backend_app TO sensa_ci_test; GRANT INSERT, UPDATE ON sensa_consumer.invitations TO sensa_ci_test;");
          await client.end();
          JS
      - name: Seed isolated curriculum fixtures
        run: |
          node --import tsx scripts/support/consumerTargetFixture.mts --write
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f /tmp/sensa-m1b-fixture.sql
      - run: node --import tsx scripts/sensaConsumerAccountSmoke.mts --targets --initial --retention --checkin --intake --semantic --provisioning
        env:
          SENSA_TEST_DATABASE_URL: postgresql://sensa_ci_test:local-test-only@127.0.0.1:5432/sensa_m1a_ci
      - name: Real API process crash recovery (no providers)
        run: node --import tsx scripts/sensaConsumerAccountSmoke.mts --crash
        env:
          SENSA_TEST_DATABASE_URL: postgresql://sensa_ci_test:local-test-only@127.0.0.1:5432/sensa_m1a_ci
      - name: Validate opt-in provider trial inputs without calls
        run: node --import tsx scripts/sensaRealProviderTrial.mts --validate
      - run: npm run sensa:edge-check
      - run: deno run --allow-env --allow-net --allow-read --allow-sys --config supabase/functions/sensa-api/deno.json scripts/sensaConsumerAccountSmoke.mts --targets --initial --retention --checkin --intake --semantic --provisioning
        env:
          SENSA_TEST_DATABASE_URL: postgresql://sensa_ci_test:local-test-only@127.0.0.1:5432/sensa_m1a_ci

      - name: Service access and usage contract (no browser or model calls)
        run: npm run sensa:service-status-smoke
      - name: Account and extension intake closure (no browser or model calls)
        env:
          SENSA_TEST_DATABASE_URL: postgresql://postgres:local-ci-only@127.0.0.1:5432/sensa_m1a_ci
        run: npm run sensa:account-service-db-smoke && npm run sensa:web-intake-smoke
      - name: Local package learning and offline shell (no browser or model calls)
        run: npm run sensa:package-learning-smoke && npm run sensa:offline-shell-smoke
      - name: Install test browser
        run: npx playwright install --with-deps chromium
      - name: Production offline cold start (isolated Chromium processes and synthetic account/catalog)
        run: npm run sensa:offline-cold-start-smoke
      - name: Cross-tab account isolation (synthetic HTTP, real browser storage)
        run: npm run sensa:web-account-isolation-smoke
      - name: Full production-preview browser journey (synthetic local services)
        env:
          SENSA_TEST_DATABASE_URL: postgresql://sensa_ci_test:local-test-only@127.0.0.1:5432/sensa_m1a_ci
          SENSA_TEST_CURRICULUM: '1'
          SENSA_TEST_INITIAL: '1'
          SENSA_TEST_RETENTION: '1'
          SENSA_TEST_CHECKIN: '1'
        run: |
          node --import tsx scripts/sensaConsumerAccountSmoke.mts --targets --serve > /tmp/sensa-api.log 2>&1 &
          api_pid=$!
          npm run preview -w @sensa/web -- --port 3001 > /tmp/sensa-web.log 2>&1 &
          web_pid=$!
          trap 'kill "$api_pid" "$web_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 40); do
            if curl -s http://127.0.0.1:4319/auth/v1/otp >/dev/null && curl -fsS http://127.0.0.1:3001 >/dev/null; then break; fi
            sleep 0.5
          done
          npm run sensa:consumer-browser-smoke


      - name: Complete application account and managed-service journey
        run: |
          VITE_SENSA_MODE=production VITE_SUPABASE_URL=http://127.0.0.1:4399 VITE_SUPABASE_PUBLISHABLE_KEY=synthetic-test-key VITE_SENSA_API_URL=http://127.0.0.1:4399 npm run build -w @sensa/web
          VITE_SENSA_MODE=production npm run preview -w @sensa/web -- --port 3014 > /tmp/sensa-full-app.log 2>&1 &
          full_app_pid=$!
          trap 'kill "$full_app_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:3014 >/dev/null; then break; fi
            sleep 0.5
          done
          npm run sensa:web-local-journey-smoke
