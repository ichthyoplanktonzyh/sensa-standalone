name: Web operational checks
on:
  workflow_dispatch:
    inputs:
      alert_drill:
        description: Create a controlled incident without user data
        required: false
        default: false
        type: boolean
  schedule:
    - cron: '17 * * * *'
permissions:
  contents: read
  issues: write
concurrency:
  group: sensa-web-monitor
  cancel-in-progress: true
jobs:
  retention:
    if: vars.SENSA_RETENTION_ENABLED == 'true'
    environment: web-production
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Prepare restricted retention connection
        env:
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
          SENSA_OPERATIONS_DATABASE_TARGET: ${{ vars.SENSA_OPERATIONS_DATABASE_TARGET }}
          SENSA_RETENTION_PASSWORD: ${{ secrets.SENSA_RETENTION_PASSWORD }}
        run: node scripts/release/operationsAccess.mjs --retention-env
      - name: Erase expired semantic lookup snapshots
        id: semantic-retention
        run: node --import tsx scripts/release/semanticLookupRetention.mts
      - name: Erase expired unreferenced sync blocks
        id: sync-retention
        env:
          SENSA_LIBRARY_HISTORY_RETENTION_ENABLED: ${{ vars.SENSA_LIBRARY_HISTORY_RETENTION_ENABLED }}
        run: node --import tsx scripts/release/libraryCloudRetention.mts
      - name: Erase expired model request receipts
        id: model-retention
        run: node --import tsx scripts/release/modelRequestRetention.mts
      - name: Deliver retention incident or recovery
        if: always() && steps.checkout.outcome == 'success'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SENSA_INCIDENT_CHECK: Retention maintenance
          SENSA_INCIDENT_ASSIGNEE: ${{ vars.SENSA_INCIDENT_ASSIGNEE }}
          SENSA_CHECK_STATUS: ${{ (steps.semantic-retention.outcome == 'success' && steps.sync-retention.outcome == 'success' && steps.model-retention.outcome == 'success') && 'success' || 'failure' }}
        run: node scripts/release/reportOperationalIncident.mjs
  monitor:
    if: vars.SENSA_MONITOR_ENABLED == 'true' || (github.event_name == 'workflow_dispatch' && inputs.alert_drill)
    environment: web-production
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Prepare read-only monitor connection
        env:
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
          SENSA_OPERATIONS_DATABASE_TARGET: ${{ vars.SENSA_OPERATIONS_DATABASE_TARGET }}
          SENSA_MONITOR_PASSWORD: ${{ secrets.SENSA_MONITOR_PASSWORD }}
        run: node scripts/release/operationsAccess.mjs --monitor-env
      - name: Check public surfaces
        id: public-surfaces
        env:
          SENSA_WEB_ORIGIN: ${{ vars.SENSA_WEB_ORIGIN }}
          VITE_SENSA_API_URL: ${{ vars.VITE_SENSA_API_URL }}
        run: node scripts/release/hostedSmoke.mjs
      - name: Check aggregate service thresholds
        id: service-thresholds
        env:
          SENSA_ALERT_MODEL_CALLS_24H: ${{ vars.SENSA_ALERT_MODEL_CALLS_24H || '500' }}
          SENSA_ALERT_MODEL_FAILURES_1H: ${{ vars.SENSA_ALERT_MODEL_FAILURES_1H || '10' }}
          SENSA_ALERT_DRILL: ${{ inputs.alert_drill || 'false' }}
        run: node scripts/release/operationalCheck.mjs
      - name: Deliver monitor incident or recovery
        if: always() && steps.checkout.outcome == 'success'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SENSA_INCIDENT_CHECK: Web operational monitor
          SENSA_INCIDENT_ASSIGNEE: ${{ vars.SENSA_INCIDENT_ASSIGNEE }}
          SENSA_CHECK_STATUS: ${{ (steps.public-surfaces.outcome == 'success' && steps.service-thresholds.outcome == 'success') && 'success' || 'failure' }}
        run: node scripts/release/reportOperationalIncident.mjs
