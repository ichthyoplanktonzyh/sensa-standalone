name: Web operational checks
on:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'
permissions:
  contents: read
concurrency:
  group: sensa-web-monitor
  cancel-in-progress: true
jobs:
  retention:
    if: vars.SENSA_RETENTION_ENABLED == 'true'
    environment: web-retention
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Erase expired semantic lookup snapshots
        env:
          SENSA_MAINTENANCE_DATABASE_URL: ${{ secrets.SENSA_MAINTENANCE_DATABASE_URL }}
        run: node --import tsx scripts/release/semanticLookupRetention.mts
      - name: Erase expired unreferenced sync blocks
        env:
          SENSA_MAINTENANCE_DATABASE_URL: ${{ secrets.SENSA_MAINTENANCE_DATABASE_URL }}
        run: node --import tsx scripts/release/libraryCloudRetention.mts
  monitor:
    if: vars.SENSA_MONITOR_ENABLED == 'true'
    environment: web-monitor
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Check public surfaces
        env:
          SENSA_WEB_ORIGIN: ${{ vars.SENSA_WEB_ORIGIN }}
          VITE_SENSA_API_URL: ${{ vars.VITE_SENSA_API_URL }}
        run: node scripts/release/hostedSmoke.mjs
      - name: Check aggregate service thresholds
        env:
          MONITOR_DATABASE_URL: ${{ secrets.MONITOR_DATABASE_URL }}
          SENSA_ALERT_MODEL_CALLS_24H: ${{ vars.SENSA_ALERT_MODEL_CALLS_24H || '500' }}
        run: node scripts/release/operationalCheck.mjs
