name: Deploy accepted Web candidate
on:
  workflow_dispatch:
    inputs:
      candidate_run_id:
        description: Successful Web candidate workflow run ID
        required: true
      release_sha:
        description: Full reviewed Git commit SHA
        required: true
      owner_accepted:
        description: Owner has accepted this exact candidate and authorized this deployment
        type: boolean
        required: true
        default: false
permissions:
  contents: read
  actions: read
concurrency:
  group: sensa-web-production
  cancel-in-progress: false
jobs:
  deploy:
    if: inputs.owner_accepted
    environment: web-production
    runs-on: ubuntu-latest
    env:
      SENSA_RELEASE_SHA: ${{ inputs.release_sha }}
      CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
      SENSA_WEB_ORIGIN: ${{ vars.SENSA_WEB_ORIGIN }}
      VITE_SENSA_API_URL: ${{ vars.VITE_SENSA_API_URL }}
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
      CLOUDFLARE_PAGES_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Verify candidate run provenance
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'JS'
          if(!/^[a-f0-9]{40}$/.test(process.env.SENSA_RELEASE_SHA)||!/^\d+$/.test(process.env.CANDIDATE_RUN_ID))throw Error('Fixed SHA and numeric candidate run required');
          const response=await fetch(`https://api.github.com/repos/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.CANDIDATE_RUN_ID}`,{headers:{authorization:`Bearer ${process.env.GH_TOKEN}`,accept:'application/vnd.github+json'}});
          if(!response.ok)throw Error('Cannot verify candidate run');const run=await response.json();
          if(run.head_sha!==process.env.SENSA_RELEASE_SHA||run.conclusion!=='success'||run.path!=='.github/workflows/sensa-web-candidate.yml')throw Error('Candidate run was not successful for the reviewed SHA');
          if(!/^[a-z0-9]{20}$/.test(process.env.SUPABASE_PROJECT_REF??'')||!new URL(process.env.VITE_SENSA_API_URL).hostname.startsWith(process.env.SUPABASE_PROJECT_REF+'.'))throw Error('Supabase target mismatch');
          JS
      - uses: actions/download-artifact@v4
        with:
          name: sensa-web-candidate-${{ inputs.release_sha }}
          run-id: ${{ inputs.candidate_run_id }}
          github-token: ${{ github.token }}
          path: .
      - run: node scripts/release/verifyCandidate.mjs
      - run: npm ci
      - name: Build server from reviewed source (preserve Web candidate)
        run: npm run build -w @sensa/learning-kernel && npm run build -w @sensa/contracts && npm run build -w @sensa/content-validator && npm run build -w @sensa/model-runtime && npm run build -w @sensa/api
      - uses: supabase/setup-cli@v1
        with:
          version: 2.117.0
      - name: Apply reviewed forward migrations
        env:
          MIGRATION_DATABASE_URL: ${{ secrets.MIGRATION_DATABASE_URL }}
        run: |
          node --input-type=module <<'JS'
          try {
            const u=new URL(process.env.MIGRATION_DATABASE_URL),ref=process.env.SUPABASE_PROJECT_REF;
            if(!['postgres:','postgresql:'].includes(u.protocol)||!['require','verify-full','verify-ca'].includes(u.searchParams.get('sslmode'))||!(u.hostname===`db.${ref}.supabase.co`||decodeURIComponent(u.username).endsWith('.'+ref)))throw Error();
          } catch { console.error('Migration database must match the approved Supabase project and require TLS.');process.exit(1); }
          JS
          npm run db:migrate
      - name: Configure accepted catalog and service boundaries
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SENSA_RUNTIME_DATABASE_URL: ${{ secrets.SENSA_RUNTIME_DATABASE_URL }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          SENSA_PROVIDER_VAULT_KEY: ${{ secrets.SENSA_PROVIDER_VAULT_KEY }}
        run: |
          node scripts/release/serviceEnvironment.mjs
          trap 'rm -f "$RUNNER_TEMP/sensa-service.env"' EXIT
          supabase secrets set --env-file "$RUNNER_TEMP/sensa-service.env" --project-ref "$SUPABASE_PROJECT_REF"
      - name: Deploy API
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase functions deploy sensa-api --project-ref "$SUPABASE_PROJECT_REF"
      - name: Publish accepted Web assets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.130.0 pages deploy apps/web/dist --project-name "$CLOUDFLARE_PAGES_PROJECT" --branch main --commit-hash "$SENSA_RELEASE_SHA"
      - name: Public non-model smoke
        run: node scripts/release/hostedSmoke.mjs
