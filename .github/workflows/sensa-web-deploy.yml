name: Deploy Sensa application component
run-name: Deploy Sensa application ${{ inputs.release_sha }}
on:
  workflow_call:
    inputs:
      release_sha:
        description: Exact green main commit selected by the system release planner
        required: true
        type: string
      candidate_run_id:
        description: Successful Sensa CI run that produced the immutable application candidate
        required: true
        type: string
      candidate_run_attempt:
        description: Build attempt that produced the immutable application candidate
        required: true
        type: string
      candidate_artifact_id:
        description: Exact immutable artifact ID verified by the release planner
        required: true
        type: string
      candidate_validation_attempt:
        description: Successful overall CI validation attempt, possibly later than the build
        required: true
        type: string
      release_id:
        required: true
        type: string
      application_mode:
        description: Planner-approved full or Web-only execution; checked against the exact saved plan
        required: true
        type: string
    outputs:
      evidence_artifact_id:
        value: ${{ jobs.deploy.outputs.artifact_id }}
permissions:
  contents: read
  actions: read
concurrency:
  group: sensa-web-production
  cancel-in-progress: false
jobs:
  deploy:
    outputs:
      artifact_id: ${{ steps.evidence.outputs.artifact-id }}
    environment:
      name: web-production
      url: ${{ vars.SENSA_WEB_ORIGIN }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SENSA_RELEASE_SHA: ${{ inputs.release_sha }}
      SENSA_APPLICATION_MODE: ${{ inputs.application_mode }}
      SENSA_CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
      SENSA_CANDIDATE_RUN_ATTEMPT: ${{ inputs.candidate_run_attempt }}
      SENSA_WEB_ORIGIN: ${{ vars.SENSA_WEB_ORIGIN }}
      VITE_SENSA_SUPPORT_URL: ${{ vars.SENSA_SUPPORT_URL }}
      VITE_SUPABASE_URL: ${{ format('https://{0}.supabase.co', vars.SUPABASE_PROJECT_REF) }}
      VITE_SENSA_API_URL: ${{ vars.VITE_SENSA_API_URL }}
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
      CLOUDFLARE_WORKER_NAME: ${{ vars.CLOUDFLARE_WORKER_NAME }}
      NODE_EXTRA_CA_CERTS: ${{ github.workspace }}/infra/certs/supabase-prod-ca-2021.crt
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.release_sha }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Restore the exact authorized application plan
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: sensa-release-plan-${{ inputs.release_id }}
          path: .tmp/application-release-plan
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ inputs.candidate_artifact_id }}
          merge-multiple: true
          path: .
          github-token: ${{ github.token }}
          run-id: ${{ inputs.candidate_run_id }}
      - name: Verify artifact and production target
        run: |
          node scripts/release/verifyCandidate.mjs
          node --input-type=module <<'JS'
          const env=process.env,project=env.SUPABASE_PROJECT_REF??'';
          if(env.CLOUDFLARE_WORKER_NAME!=='sensa-standalone')throw Error('Cloudflare Worker target mismatch');
          let api;try{api=new URL(env.VITE_SENSA_API_URL);}catch{throw Error('Production API URL required');}
          if(!/^[a-z0-9]{20}$/.test(project)||api.hostname!==`${project}.supabase.co`||api.pathname.replace(/\/$/,'')!=='/functions/v1/sensa-api')throw Error('Supabase target mismatch');
          console.log('Verified production Supabase and Cloudflare targets.');
          JS
      - name: Restore the read-only verifier from this exact workflow revision
        env:
          SENSA_VERIFIER_SHA: ${{ github.workflow_sha }}
        run: |
          git fetch --no-tags --depth=1 origin "$SENSA_VERIFIER_SHA"
          git show "$SENSA_VERIFIER_SHA:scripts/release/liveVerification.mjs" > "$RUNNER_TEMP/sensa-live-verification.mjs"
          node --input-type=module <<'JS'
          import {readFileSync,writeFileSync} from 'node:fs';
          import {createHash} from 'node:crypto';
          const sha=process.env.SENSA_VERIFIER_SHA;
          if(!/^[a-f0-9]{40}$/.test(sha??''))throw Error('Exact verifier revision required');
          const bytes=readFileSync(process.env.RUNNER_TEMP+'/sensa-live-verification.mjs');
          writeFileSync('release-candidate/deployment-verifier-source.json',JSON.stringify({format:'sensa-deployment-verifier-source-v1',sourceCommit:sha,applicationCommit:process.env.SENSA_RELEASE_SHA,sha256:createHash('sha256').update(bytes).digest('hex')},null,2)+'\n');
          JS
      - name: Refuse Web-only target or live backend drift before any mutation
        id: preflight
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          node --input-type=module <<'JS'
          import {readFileSync} from 'node:fs';
          const plan=JSON.parse(readFileSync('.tmp/application-release-plan/system-release-plan.json','utf8'));
          if(plan.decision.applicationMode!==process.env.SENSA_APPLICATION_MODE)throw Error('Application mode differs from the saved release plan');
          JS
          node "$RUNNER_TEMP/sensa-live-verification.mjs" preflight
      - uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520 # v3.0.0
        if: ${{ inputs.application_mode == 'full' }}
        with:
          version: 2.117.0
      - name: Apply pending forward migrations
        id: migrations
        if: ${{ inputs.application_mode == 'full' }}
        env:
          MIGRATION_DATABASE_URL: ${{ secrets.MIGRATION_DATABASE_URL }}
        run: |
          node --input-type=module <<'JS'
          try {
            const u=new URL(process.env.MIGRATION_DATABASE_URL),ref=process.env.SUPABASE_PROJECT_REF;
            if(!['postgres:','postgresql:'].includes(u.protocol)||!['require','verify-full','verify-ca'].includes(u.searchParams.get('sslmode'))||!(u.hostname===`db.${ref}.supabase.co`||decodeURIComponent(u.username).endsWith('.'+ref)))throw Error();
          } catch { console.error('Migration database must match the approved Supabase project and require TLS.');process.exit(1); }
          JS
          npm run db:migrate
      - name: Keep production Auth redirects aligned
        id: auth_config
        if: ${{ inputs.application_mode == 'full' }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: node scripts/release/supabaseAuthConfig.mjs --apply
      - name: Configure accepted catalog and service boundaries
        id: service_config
        if: ${{ inputs.application_mode == 'full' }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SENSA_RUNTIME_DATABASE_URL: ${{ secrets.SENSA_RUNTIME_DATABASE_URL }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          SENSA_PROVIDER_VAULT_KEY: ${{ secrets.SENSA_PROVIDER_VAULT_KEY }}
        run: |
          node scripts/release/serviceEnvironment.mjs
          trap 'rm -f "$RUNNER_TEMP/sensa-service.env"' EXIT
          supabase secrets set --env-file "$RUNNER_TEMP/sensa-service.env" --project-ref "$SUPABASE_PROJECT_REF"
      - name: Deploy API
        id: api_deploy
        if: ${{ inputs.application_mode == 'full' }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase functions deploy sensa-api --project-ref "$SUPABASE_PROJECT_REF"
      - name: Upload Cloudflare version
        id: web_version
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_OUTPUT_FILE_PATH: ${{ runner.temp }}/wrangler-output.jsonl
        run: |
          npx wrangler versions upload --name "$CLOUDFLARE_WORKER_NAME" --tag "$SENSA_RELEASE_SHA" --message "GitHub Actions $GITHUB_RUN_ID" --strict
          node scripts/release/readWranglerOutput.mjs
      - name: Verify uploaded Web version
        id: web_preview
        env:
          SENSA_WEB_ORIGIN: ${{ steps.web_version.outputs.preview_url }}
          SENSA_PREVIEW_URL: ${{ steps.web_version.outputs.preview_url }}
        run: |
          node scripts/release/hostedWebSmoke.mjs
          node "$RUNNER_TEMP/sensa-live-verification.mjs" preview
      - name: Promote Web version to production
        id: web_promote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler versions deploy "${{ steps.web_version.outputs.version_id }}@100%" --name "$CLOUDFLARE_WORKER_NAME" --message "Authorized release $SENSA_RELEASE_SHA" -y
      - name: Apply production domain routing
        id: domain_routes
        if: ${{ inputs.application_mode == 'full' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler triggers deploy --name "$CLOUDFLARE_WORKER_NAME"
      - name: Public non-model smoke
        id: public_smoke
        run: node scripts/release/hostedSmoke.mjs
      - name: Verify actual API build, Web file bytes and Cloudflare traffic
        id: live_verification
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: node "$RUNNER_TEMP/sensa-live-verification.mjs" live
      - name: Record actual application step outcomes even after failure
        if: always()
        env:
          SENSA_RELEASE_STEPS: ${{ toJSON(steps) }}
        run: node scripts/release/releaseStatus.mjs application
      - name: Preserve release evidence
        id: evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sensa-release-evidence-${{ inputs.release_id }}-attempt-${{ github.run_attempt }}
          retention-days: 30
          if-no-files-found: warn
          path: |
            release-candidate/manifest.json
            release-candidate/cloudflare-version.json
            release-candidate/application-release-status.json
            release-candidate/application-live-verification.json
            release-candidate/deployment-verifier-source.json
            ${{ runner.temp }}/wrangler-output.jsonl
