name: Deploy Sensa production
run-name: Deploy Sensa ${{ inputs.release_sha || github.sha }}
on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: Full main commit SHA; leave blank to deploy the selected workflow revision
        required: false
        type: string
      owner_accepted:
        description: Authorize this exact revision for production deployment
        type: boolean
        required: true
        default: false
permissions:
  contents: read
  actions: read
concurrency:
  group: sensa-web-production
  cancel-in-progress: false
jobs:
  gate:
    if: inputs.owner_accepted
    runs-on: ubuntu-latest
    timeout-minutes: 16
    outputs:
      release_sha: ${{ steps.release.outputs.sha }}
    env:
      SENSA_RELEASE_SHA: ${{ inputs.release_sha || github.sha }}
    steps:
      - name: Require green main CI for this revision
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'JS'
          import {appendFileSync} from 'node:fs';
          const env=process.env,sha=env.SENSA_RELEASE_SHA??'';
          if(!/^[a-f0-9]{40}$/.test(sha)||!env.GH_TOKEN||!env.GITHUB_REPOSITORY)throw Error('Full release SHA and GitHub Actions identity required');
          const endpoint=new URL(`https://api.github.com/repos/${env.GITHUB_REPOSITORY}/actions/workflows/sensa-consumer-check.yml/runs`);
          for(const [key,value] of Object.entries({branch:'main',event:'push',head_sha:sha,per_page:'10'}))endpoint.searchParams.set(key,value);
          for(let attempt=0;attempt<56;attempt++){
            const response=await fetch(endpoint,{headers:{authorization:`Bearer ${env.GH_TOKEN}`,accept:'application/vnd.github+json','x-github-api-version':'2026-03-10'}});
            if(!response.ok)throw Error(`Cannot verify Sensa CI (${response.status})`);
            const payload=await response.json(),run=payload.workflow_runs?.find(candidate=>candidate.head_sha===sha&&candidate.head_branch==='main'&&candidate.event==='push');
            if(run?.conclusion==='success'){
              appendFileSync(env.GITHUB_OUTPUT,`sha=${sha}\n`);
              console.log(`Verified green Sensa CI run ${run.id} for ${sha}.`);
              process.exit(0);
            }
            if(run?.status==='completed')throw Error(`Sensa CI run ${run.id} concluded ${run.conclusion}`);
            if(attempt===55)throw Error('Sensa CI did not complete for this exact main commit within 14 minutes');
            console.log(run?`Waiting for Sensa CI run ${run.id} (${run.status})...`:'Waiting for the main CI run to appear...');
            await new Promise(resolve=>setTimeout(resolve,15000));
          }
          JS

  build:
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment: web-candidate
    env:
      SENSA_RELEASE_SHA: ${{ needs.gate.outputs.release_sha }}
      VITE_SENSA_MODE: production
      SENSA_WEB_ORIGIN: ${{ vars.SENSA_WEB_ORIGIN }}
      VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
      VITE_SENSA_API_URL: ${{ vars.VITE_SENSA_API_URL }}
      SENSA_EXTENSION_WEB_URL: ${{ vars.SENSA_WEB_ORIGIN }}
      SENSA_EXTENSION_API_URL: ${{ vars.VITE_SENSA_API_URL }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.gate.outputs.release_sha }}
      - name: Verify exact revision
        run: node scripts/release/verifyRevision.mjs
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Refuse incomplete or unsafe release configuration
        run: node scripts/release/releaseCandidate.mjs --check
      - name: Build the production delivery surface once
        run: |
          npm run build -w @sensa/learning-kernel
          npm run build -w @sensa/contracts
          npm run build -w @sensa/content-validator
          npm run build -w @sensa/model-runtime
          npm run build -w @sensa/mcp-server
          npm run build -w @sensa/api
          npm run build -w @sensa/web
          npm run build -w @sensa/browser-extension
      - name: Prepare and verify the fixed delivery artifact
        run: |
          node scripts/release/releaseCandidate.mjs
          node scripts/release/verifyCandidate.mjs
      - name: Validate Cloudflare bundle without deployment
        run: npx wrangler versions upload --dry-run --strict
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sensa-production-${{ needs.gate.outputs.release_sha }}
          retention-days: 7
          if-no-files-found: error
          path: |
            apps/web/dist/
            apps/browser-extension/dist/
            apps/api/dist/
            packages/contracts/dist/
            packages/learning-kernel/dist/
            packages/content-validator/dist/
            packages/model-runtime/dist/
            packages/mcp-server/dist/
            release-candidate/manifest.json

  deploy:
    needs: [gate, build]
    environment:
      name: web-production
      url: ${{ vars.SENSA_WEB_ORIGIN }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SENSA_RELEASE_SHA: ${{ needs.gate.outputs.release_sha }}
      SENSA_WEB_ORIGIN: ${{ vars.SENSA_WEB_ORIGIN }}
      VITE_SENSA_API_URL: ${{ vars.VITE_SENSA_API_URL }}
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
      CLOUDFLARE_WORKER_NAME: ${{ vars.CLOUDFLARE_WORKER_NAME }}
      NODE_EXTRA_CA_CERTS: ${{ github.workspace }}/infra/certs/supabase-prod-ca-2021.crt
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.gate.outputs.release_sha }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sensa-production-${{ needs.gate.outputs.release_sha }}
          path: .
      - name: Verify artifact and production target
        run: |
          node scripts/release/verifyCandidate.mjs
          node --input-type=module <<'JS'
          const env=process.env,project=env.SUPABASE_PROJECT_REF??'';
          if(env.CLOUDFLARE_WORKER_NAME!=='sensa-standalone')throw Error('Cloudflare Worker target mismatch');
          let api;try{api=new URL(env.VITE_SENSA_API_URL);}catch{throw Error('Production API URL required');}
          if(!/^[a-z0-9]{20}$/.test(project)||api.hostname!==`${project}.supabase.co`||api.pathname.replace(/\/$/,'')!=='/functions/v1/sensa-api')throw Error('Supabase target mismatch');
          console.log('Verified production Supabase and Cloudflare targets.');
          JS
      - uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520 # v3.0.0
        with:
          version: 2.117.0
      - name: Apply pending forward migrations
        env:
          MIGRATION_DATABASE_URL: ${{ secrets.MIGRATION_DATABASE_URL }}
        run: |
          node --input-type=module <<'JS'
          try {
            const u=new URL(process.env.MIGRATION_DATABASE_URL),ref=process.env.SUPABASE_PROJECT_REF;
            if(!['postgres:','postgresql:'].includes(u.protocol)||!['require','verify-full','verify-ca'].includes(u.searchParams.get('sslmode'))||!(u.hostname===`db.${ref}.supabase.co`||decodeURIComponent(u.username).endsWith('.'+ref)))throw Error();
          } catch { console.error('Migration database must match the approved Supabase project and require TLS.');process.exit(1); }
          JS
          npm run db:migrate
      - name: Keep production Auth redirects aligned
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: node scripts/release/supabaseAuthConfig.mjs --apply
      - name: Configure accepted catalog and service boundaries
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SENSA_RUNTIME_DATABASE_URL: ${{ secrets.SENSA_RUNTIME_DATABASE_URL }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          SENSA_PROVIDER_VAULT_KEY: ${{ secrets.SENSA_PROVIDER_VAULT_KEY }}
        run: |
          node scripts/release/serviceEnvironment.mjs
          trap 'rm -f "$RUNNER_TEMP/sensa-service.env"' EXIT
          supabase secrets set --env-file "$RUNNER_TEMP/sensa-service.env" --project-ref "$SUPABASE_PROJECT_REF"
      - name: Deploy API
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase functions deploy sensa-api --project-ref "$SUPABASE_PROJECT_REF"
      - name: Upload Cloudflare version
        id: web_version
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_OUTPUT_FILE_PATH: ${{ runner.temp }}/wrangler-output.jsonl
        run: |
          npx wrangler versions upload --name "$CLOUDFLARE_WORKER_NAME" --tag "$SENSA_RELEASE_SHA" --message "GitHub Actions $GITHUB_RUN_ID" --strict
          node scripts/release/readWranglerOutput.mjs
      - name: Verify uploaded Web version
        env:
          SENSA_WEB_ORIGIN: ${{ steps.web_version.outputs.preview_url }}
        run: node scripts/release/hostedWebSmoke.mjs
      - name: Promote Web version to production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler versions deploy "${{ steps.web_version.outputs.version_id }}@100%" --name "$CLOUDFLARE_WORKER_NAME" --message "Authorized release $SENSA_RELEASE_SHA" -y
      - name: Public non-model smoke
        run: node scripts/release/hostedSmoke.mjs
      - name: Preserve release evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sensa-release-evidence-${{ needs.gate.outputs.release_sha }}
          retention-days: 30
          if-no-files-found: warn
          path: |
            release-candidate/manifest.json
            release-candidate/cloudflare-version.json
            ${{ runner.temp }}/wrangler-output.jsonl
