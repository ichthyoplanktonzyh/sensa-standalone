name: Release Sensa production
run-name: >-
  Release Sensa ${{ github.event.workflow_run.head_sha || inputs.release_sha || github.sha }}
  (${{ github.event_name == 'workflow_run' && 'automatic-policy' || inputs.scope }})
on:
  workflow_run:
    workflows: [Sensa CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      release_sha:
        description: Full green main commit SHA; leave blank for the selected workflow revision
        required: false
        type: string
      scope:
        description: Auto publishes changed components; explicit scopes may republish but cannot omit required changes
        required: true
        default: auto
        type: choice
        options:
          - auto
          - application
          - content
          - all
      media_release_tag:
        description: Required only when the plan publishes learning content
        required: false
        type: string
      media_pack_sha256:
        description: Full authored-media-pack SHA-256; required only for learning content
        required: false
        type: string
      owner_accepted:
        description: Authorize the planned production changes for this exact revision
        required: true
        default: false
        type: boolean
permissions:
  contents: read
  actions: read
concurrency:
  group: sensa-production
  cancel-in-progress: false
jobs:
  plan:
    if: >-
      ${{
        github.event_name == 'workflow_dispatch' ||
        (github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.event == 'push' &&
          github.event.workflow_run.head_branch == 'main')
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 18
    outputs:
      release_sha: ${{ steps.release.outputs.sha }}
      release_id: ${{ steps.planner.outputs.release_id }}
      deploy_application: ${{ steps.planner.outputs.deploy_application }}
      application_mode: ${{ steps.planner.outputs.application_mode }}
      publish_learning_content: ${{ steps.planner.outputs.publish_learning_content }}
      candidate_run_id: ${{ steps.ci.outputs.run_id }}
      candidate_run_attempt: ${{ steps.candidate.outputs.build_attempt }}
      candidate_artifact_id: ${{ steps.candidate.outputs.artifact_id }}
      candidate_validation_attempt: ${{ steps.ci.outputs.run_attempt }}
      authorization_outcome: ${{ steps.planner.outputs.authorization_outcome }}
    env:
      SENSA_RELEASE_MODE: ${{ github.event_name == 'workflow_run' && 'automatic' || 'manual' }}
      SENSA_RELEASE_SHA: ${{ github.event.workflow_run.head_sha || inputs.release_sha || github.sha }}
    steps:
      - name: Require owner authorization
        if: ${{ github.event_name == 'workflow_dispatch' && !inputs.owner_accepted }}
        run: |
          echo 'Production release requires owner_accepted=true.' >&2
          exit 1
      - name: Resolve the immutable revision
        id: release
        run: |
          node --input-type=module <<'JS'
          import {appendFileSync} from 'node:fs';
          const sha=process.env.SENSA_RELEASE_SHA??'';
          if(!/^[a-f0-9]{40}$/.test(sha))throw Error('Full release SHA required');
          appendFileSync(process.env.GITHUB_OUTPUT,`sha=${sha}\nshort_sha=${sha.slice(0,12)}\n`);
          JS
      - name: Require green main CI for this revision
        id: ci
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'JS'
          import {appendFileSync,readFileSync} from 'node:fs';
          const env=process.env,sha=env.SENSA_RELEASE_SHA??'';
          if(!env.GH_TOKEN||!env.GITHUB_REPOSITORY)throw Error('GitHub Actions identity required');
          if(env.GITHUB_EVENT_NAME==='workflow_run'){
            const event=JSON.parse(readFileSync(env.GITHUB_EVENT_PATH,'utf8')),run=event.workflow_run;
            if(event.repository?.full_name!==env.GITHUB_REPOSITORY
              ||run?.head_repository?.full_name!==env.GITHUB_REPOSITORY
              ||run?.name!=='Sensa CI'||run?.event!=='push'||run?.head_branch!=='main'
              ||run?.head_sha!==sha||run?.status!=='completed'||run?.conclusion!=='success'
              ||!Number.isSafeInteger(run?.id)||!Number.isSafeInteger(run?.run_attempt)){
              throw Error('Automatic release requires the successful same-repository Sensa CI main run');
            }
            console.log(`Accepted automatic release provenance from Sensa CI run ${run.id} for ${sha}.`);
            appendFileSync(env.GITHUB_OUTPUT,`run_id=${run.id}\nrun_attempt=${run.run_attempt}\n`);
            process.exit(0);
          }
          const endpoint=new URL(`https://api.github.com/repos/${env.GITHUB_REPOSITORY}/actions/workflows/sensa-consumer-check.yml/runs`);
          for(const [key,value] of Object.entries({branch:'main',event:'push',head_sha:sha,per_page:'10'}))endpoint.searchParams.set(key,value);
          {
            const response=await fetch(endpoint,{headers:{authorization:`Bearer ${env.GH_TOKEN}`,accept:'application/vnd.github+json','x-github-api-version':'2026-03-10'}});
            if(!response.ok)throw Error(`Cannot verify Sensa CI (${response.status})`);
            const payload=await response.json(),run=payload.workflow_runs?.find(candidate=>candidate.head_sha===sha&&candidate.head_branch==='main'&&candidate.event==='push');
            if(run?.conclusion==='success'){
              console.log(`Verified green Sensa CI run ${run.id} for ${sha}.`);
              appendFileSync(env.GITHUB_OUTPUT,`run_id=${run.id}\nrun_attempt=${run.run_attempt}\n`);
              process.exit(0);
            }
            throw Error(run ? `Sensa CI run ${run.id} is ${run.status}/${run.conclusion}; wait for this exact revision to pass before releasing` : 'No main CI run exists for this exact revision');
          }
          JS
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.release.outputs.sha }}
          fetch-depth: 0
      - name: Restore the previous successful system manifest
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release/releaseArchive.mjs baseline
      - name: Plan the smallest safe system release
        id: planner
        env:
          SENSA_RELEASE_SCOPE: ${{ github.event_name == 'workflow_run' && 'auto' || inputs.scope }}
          SENSA_MEDIA_RELEASE_TAG: ${{ inputs.media_release_tag }}
          SENSA_MEDIA_PACK_SHA256: ${{ inputs.media_pack_sha256 }}
          SENSA_SYSTEM_RELEASE_ID: sensa-system-${{ steps.release.outputs.short_sha }}-${{ github.run_id }}-${{ github.run_attempt }}
        run: node scripts/release/systemRelease.mjs plan
      - name: Resolve the immutable build independently of validation reruns
        id: candidate
        if: ${{ steps.planner.outputs.deploy_application == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          SENSA_CANDIDATE_RUN_ID: ${{ steps.ci.outputs.run_id }}
          SENSA_VALIDATION_RUN_ATTEMPT: ${{ steps.ci.outputs.run_attempt }}
        run: node scripts/release/candidateSource.mjs
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sensa-release-plan-${{ steps.planner.outputs.release_id }}
          retention-days: 30
          if-no-files-found: error
          path: |
            release-candidate/system-release-plan.json
            release-candidate/ci-candidate-source.json

  learning_content:
    needs: plan
    if: ${{ needs.plan.outputs.publish_learning_content == 'true' }}
    uses: ./.github/workflows/sensa-learning-content-publish.yml
    with:
      release_sha: ${{ needs.plan.outputs.release_sha }}
      media_release_tag: ${{ inputs.media_release_tag }}
      media_pack_sha256: ${{ inputs.media_pack_sha256 }}
      release_id: ${{ needs.plan.outputs.release_id }}
    secrets: inherit

  application:
    needs: [plan, learning_content]
    if: >-
      ${{
        always() &&
        needs.plan.result == 'success' &&
        needs.plan.outputs.deploy_application == 'true' &&
        (needs.plan.outputs.publish_learning_content != 'true' || needs.learning_content.result == 'success')
      }}
    uses: ./.github/workflows/sensa-web-deploy.yml
    with:
      release_sha: ${{ needs.plan.outputs.release_sha }}
      candidate_run_id: ${{ needs.plan.outputs.candidate_run_id }}
      candidate_run_attempt: ${{ needs.plan.outputs.candidate_run_attempt }}
      candidate_artifact_id: ${{ needs.plan.outputs.candidate_artifact_id }}
      candidate_validation_attempt: ${{ needs.plan.outputs.candidate_validation_attempt }}
      release_id: ${{ needs.plan.outputs.release_id }}
      application_mode: ${{ needs.plan.outputs.application_mode }}
    secrets: inherit

  record:
    needs: [plan, learning_content, application]
    if: >-
      ${{
        always() &&
        needs.plan.result == 'success' &&
        needs.plan.outputs.authorization_outcome != 'requires-approval' &&
        (needs.plan.outputs.publish_learning_content != 'true' || needs.learning_content.result == 'success') &&
        (needs.plan.outputs.deploy_application != 'true' || needs.application.result == 'success')
      }}
    runs-on: ubuntu-latest
    outputs:
      manifest_artifact_id: ${{ steps.recorded.outputs.artifact-id }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.release_sha }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sensa-release-plan-${{ needs.plan.outputs.release_id }}
          path: .tmp/system-release-plan
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: ${{ needs.plan.outputs.deploy_application == 'true' }}
        with:
          artifact-ids: ${{ needs.application.outputs.evidence_artifact_id }}
          merge-multiple: true
          path: .tmp/application-evidence
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: ${{ needs.plan.outputs.publish_learning_content == 'true' }}
        with:
          artifact-ids: ${{ needs.learning_content.outputs.evidence_artifact_id }}
          merge-multiple: true
          path: .tmp/content-evidence
      - name: Record the complete production state
        env:
          SENSA_APPLICATION_EVIDENCE_DIRECTORY: .tmp/application-evidence
          SENSA_CONTENT_EVIDENCE_DIRECTORY: .tmp/content-evidence
        run: node scripts/release/systemRelease.mjs finalize
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        id: recorded
        with:
          name: sensa-system-release-${{ needs.plan.outputs.release_sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 90
          if-no-files-found: error
          path: release-candidate/system-release-manifest.json

  archive:
    needs: [plan, record]
    if: ${{ always() && needs.record.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.plan.outputs.release_sha }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          artifact-ids: ${{ needs.record.outputs.manifest_artifact_id }}
          merge-multiple: true
          path: .tmp/system-release-record
      - name: Archive verified candidate bytes and system state without redeploying
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release/releaseArchive.mjs persist
      - name: Preserve the native archive receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: sensa-native-release-${{ needs.plan.outputs.release_id }}-attempt-${{ github.run_attempt }}
          retention-days: 90
          if-no-files-found: warn
          path: |
            release-candidate/system-release-manifest.json
            release-candidate/native-release-archive.json

  report:
    needs: [plan, learning_content, application, record, archive]
    if: ${{ always() && needs.plan.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.plan.outputs.release_sha }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: sensa-release-plan-${{ needs.plan.outputs.release_id }}
          path: .tmp/system-release-plan
      - name: Distinguish authorization, completion and failed component execution
        env:
          SENSA_RELEASE_JOBS: '{"application":"${{ needs.application.result }}","learning_content":"${{ needs.learning_content.result }}","record":"${{ needs.record.result }}","archive":"${{ needs.archive.result }}"}'
        run: node scripts/release/releaseStatus.mjs system
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: sensa-release-status-${{ needs.plan.outputs.release_id }}-attempt-${{ github.run_attempt }}
          retention-days: 90
          if-no-files-found: error
          path: release-candidate/system-release-status.json
