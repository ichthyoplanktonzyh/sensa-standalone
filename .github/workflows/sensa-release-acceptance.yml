name: Sensa release acceptance
on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: Full Git commit SHA to test for release
        required: true
permissions:
  contents: read
concurrency:
  group: sensa-release-acceptance-${{ inputs.release_sha }}
  cancel-in-progress: false
env:
  SENSA_RELEASE_SHA: ${{ inputs.release_sha }}
jobs:
  connected-application:
    name: Connected application and extension E2E
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: local-ci-only
          POSTGRES_DB: sensa_m1a_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      SENSA_EXTENSION_LEGACY_WEB: '1'
      SENSA_EXTENSION_WEB_URL: http://127.0.0.1:3001
      VITE_SENSA_MODE: legacy-account
      VITE_SUPABASE_URL: http://127.0.0.1:4319
      VITE_SUPABASE_PUBLISHABLE_KEY: local-browser-test-key
      VITE_SENSA_API_URL: http://127.0.0.1:4319
      DATABASE_URL: postgresql://postgres:local-ci-only@127.0.0.1:5432/sensa_m1a_ci
      SENSA_TEST_DATABASE_URL: postgresql://sensa_ci_test:local-test-only@127.0.0.1:5432/sensa_m1a_ci
      SENSA_TEST_CURRICULUM: '1'
      SENSA_TEST_INITIAL: '1'
      SENSA_TEST_RETENTION: '1'
      SENSA_TEST_CHECKIN: '1'
      SENSA_ACCEPTANCE_ARTIFACT_DIR: ${{ runner.temp }}/sensa-connected-acceptance
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.release_sha }}
      - run: node scripts/release/verifyRevision.mjs
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/web-next/package-lock.json
      - run: npm ci
      - run: npm ci --prefix apps/web-next
      - run: npm run build
      - run: npm run db:migrate
      - name: Create restricted test principal
        run: |
          node --input-type=module <<'JS'
          import pg from 'pg';
          const client=new pg.Client({connectionString:process.env.DATABASE_URL});
          await client.connect();
          await client.query("CREATE ROLE sensa_ci_test LOGIN PASSWORD 'local-test-only'; GRANT backend_app TO sensa_ci_test; GRANT INSERT, UPDATE ON sensa_consumer.invitations TO sensa_ci_test;");
          await client.end();
          JS
      - name: Seed isolated curriculum fixtures
        run: |
          node --import tsx scripts/support/consumerTargetFixture.mts --write
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f /tmp/sensa-m1b-fixture.sql
      - run: npx playwright install --with-deps chromium
      - name: Account sync, offline conflict and extension collection
        run: node scripts/release/runBrowserAcceptance.mjs connected
      - name: Upload browser diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: connected-acceptance-${{ inputs.release_sha }}
          if-no-files-found: warn
          retention-days: 7
          path: |
            ${{ runner.temp }}/sensa-connected-acceptance/
            /tmp/sensa-m2-*.png

  data-control:
    name: Offline, deletion and backup E2E
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.release_sha }}
      - run: node scripts/release/verifyRevision.mjs
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Cross-browser account recovery
        run: npm run sensa:email-link-browser-smoke && npm run sensa:web-account-isolation-smoke
      - name: Offline cold start and upgrade recovery
        run: npm run sensa:offline-cold-start-smoke && node --import tsx scripts/sensaOfflineColdStartSmoke.mts --upgrade
      - name: Account deletion and encrypted backup recovery
        run: node --import tsx scripts/sensaOfflineColdStartSmoke.mts --deletion && npm run sensa:library-backup-browser-smoke
      - name: Intake recovery in a fresh browser process
        run: npm run sensa:personal-intake-browser-smoke
      - name: Upload browser diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: data-control-acceptance-${{ inputs.release_sha }}
          if-no-files-found: warn
          retention-days: 7
          path: /tmp/sensa-*/

  local-experience:
    name: Complete local application journeys
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SENSA_ACCEPTANCE_ARTIFACT_DIR: ${{ runner.temp }}/sensa-local-acceptance
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.release_sha }}
      - run: node scripts/release/verifyRevision.mjs
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: node scripts/release/runBrowserAcceptance.mjs local
      - name: Upload browser diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: local-experience-acceptance-${{ inputs.release_sha }}
          if-no-files-found: warn
          retention-days: 7
          path: |
            ${{ runner.temp }}/sensa-local-acceptance/
            /tmp/sensa-web-local/
            /tmp/sensa-expression-chat/
