name: Sensa deep release validation (no deployment)
on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: Full Git commit SHA to build
        required: true
permissions:
  contents: read
concurrency:
  group: sensa-release-candidate-${{ inputs.release_sha }}
  cancel-in-progress: true
jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: web-candidate
    env:
      SENSA_RELEASE_SHA: ${{ inputs.release_sha }}
      VITE_SENSA_MODE: production
      SENSA_WEB_ORIGIN: ${{ vars.SENSA_WEB_ORIGIN }}
      VITE_SENSA_SUPPORT_URL: ${{ vars.SENSA_SUPPORT_URL }}
      VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
      VITE_SENSA_API_URL: ${{ vars.VITE_SENSA_API_URL }}
      SENSA_EXTENSION_WEB_URL: ${{ vars.SENSA_WEB_ORIGIN }}
      SENSA_EXTENSION_API_URL: ${{ vars.VITE_SENSA_API_URL }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.release_sha }}
      - run: node scripts/release/verifyRevision.mjs
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.x
      - run: npm ci
      - name: Refuse incomplete or unsafe release configuration
        run: node scripts/release/releaseCandidate.mjs --check
      - run: npm run typecheck
      - run: npm run build
      - run: npm run test:edge
      - name: Install Chromium for the boot budget check
        run: npx playwright install --with-deps chromium
      - name: Enforce App Shell boot and account restore budget
        run: npm run test:browser
      - name: Validate release configuration and telemetry guards
        run: |
          node --import tsx tests/web/run.mts --suite=fast --id=release-candidate
          node --import tsx tests/web/run.mts --suite=fast --id=telemetry
          node --import tsx tests/web/run.mts --suite=fast --id=model-budget
      - name: Prepare fixed release candidate
        run: node scripts/release/releaseCandidate.mjs
      - name: Validate Cloudflare bundle without deployment
        run: npx wrangler versions upload --dry-run --strict
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sensa-release-candidate-${{ inputs.release_sha }}
          retention-days: 14
          if-no-files-found: error
          path: |
            apps/web/dist/
            apps/browser-extension/dist/
            apps/api/dist/
            packages/contracts/dist/
            packages/learning-kernel/dist/
            packages/content-validator/dist/
            packages/model-runtime/dist/
            packages/mcp-server/dist/
            release-candidate/manifest.json
