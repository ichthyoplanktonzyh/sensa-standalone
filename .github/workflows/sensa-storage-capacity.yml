name: Storage capacity validation
on:
  workflow_call:
    inputs:
      release_sha:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      release_sha:
        description: Full revision to test; blank uses the selected workflow revision
        required: false
        type: string
permissions:
  contents: read
jobs:
  capacity:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      SENSA_RELEASE_SHA: ${{ inputs.release_sha || github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.release_sha || github.sha }}
      - name: Verify the exact capacity revision
        run: node scripts/release/verifyRevision.mjs
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build:shared
      - name: Run retained 10k storage assertions outside the fast lane
        run: npm run test:capacity:storage
      - name: Preserve native capacity selection and failures
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: sensa-storage-capacity-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: .tmp/test-results/capacity/
          retention-days: 7
          if-no-files-found: warn
