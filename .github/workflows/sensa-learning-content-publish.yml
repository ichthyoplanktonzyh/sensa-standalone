name: Publish Sensa learning-content component
run-name: Publish learning content from ${{ inputs.release_sha }} with ${{ inputs.media_release_tag }}
on:
  workflow_call:
    inputs:
      release_sha:
        description: Full green main commit SHA containing the authored release
        required: true
        type: string
      media_release_tag:
        description: GitHub Release tag containing authored-media-pack.json
        required: true
        type: string
      media_pack_sha256:
        description: Full SHA-256 of authored-media-pack.json
        required: true
        type: string
      release_id:
        required: true
        type: string
      plan_artifact_id:
        required: true
        type: string
      content_artifact_id:
        required: true
        type: string
      content_build_attempt:
        required: true
        type: string
    outputs:
      evidence_artifact_id:
        value: ${{ jobs.publish.outputs.artifact_id }}
permissions:
  contents: read
  actions: read
concurrency:
  group: sensa-learning-content-production
  cancel-in-progress: false
jobs:
  publish:
    outputs:
      artifact_id: ${{ steps.evidence.outputs.artifact-id }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: learning-content-production
    env:
      SENSA_RELEASE_SHA: ${{ inputs.release_sha }}
      SENSA_MEDIA_RELEASE_TAG: ${{ inputs.media_release_tag }}
      SENSA_MEDIA_PACK_SHA256: ${{ inputs.media_pack_sha256 }}
      SENSA_CONTENT_BUILD_ATTEMPT: ${{ inputs.content_build_attempt }}
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
      SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
      SENSA_WEB_ORIGIN: ${{ vars.SENSA_WEB_ORIGIN }}
      SENSA_PACKAGE_BUCKET: sensa-learning-content
      SENSA_PACKAGE_OUTPUT: .tmp/learning-content/releases
      SENSA_PACKAGE_CATALOG: release-candidate/portable-catalog.json
      SENSA_PACKAGE_BASE_URL: ${{ vars.VITE_SUPABASE_URL }}/storage/v1/object/public/sensa-learning-content/releases/
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.release_sha }}
      - name: Verify exact revision
        run: node scripts/release/verifyRevision.mjs
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          artifact-ids: ${{ inputs.plan_artifact_id }}
          merge-multiple: true
          path: .tmp/system-release-plan
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          artifact-ids: ${{ inputs.content_artifact_id }}
          merge-multiple: true
          path: .
      - name: Verify the sealed preflight content without rebuilding
        id: candidate
        run: node scripts/release/contentCandidate.mjs verify
      - name: Recheck the content write boundary after any application deployment
        id: write_boundary
        env:
          SENSA_PREFLIGHT_SCOPE: content-write-boundary
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: node scripts/release/releasePreflight.mjs content
      - name: Upload releases, verify public bytes, and prepare promotion
        id: upload
        env:
          SENSA_CONTENT_PUBLISH: 'true'
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          SENSA_REGISTRY_ENV_OUTPUT: ${{ runner.temp }}/sensa-learning-registry.env
        run: node scripts/release/publishPortableLearningRegistry.mjs
      - uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520 # v3.0.0
        with:
          version: 2.117.0
      - name: Inspect whether this exact Registry is already promoted
        id: current
        run: node scripts/release/verifyContentPromotion.mjs check
      - name: Promote the verified Registry snapshot
        id: promote
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          trap 'rm -f "$RUNNER_TEMP/sensa-learning-registry.env"' EXIT
          if test "${{ steps.current.outputs.already_promoted }}" = true; then
            echo 'Exact Registry already active; secret promotion skipped.'
          else
            supabase secrets set --env-file "$RUNNER_TEMP/sensa-learning-registry.env" --project-ref "$SUPABASE_PROJECT_REF"
          fi
      - name: Verify the actual promoted public Registry
        id: live_verification
        run: node scripts/release/verifyContentPromotion.mjs
      - name: Record actual content outcomes even after failure
        if: always()
        env:
          SENSA_RELEASE_STEPS: ${{ toJSON(steps) }}
        run: node scripts/release/releaseStatus.mjs content
      - name: Preserve publication evidence
        id: evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sensa-learning-content-${{ inputs.release_id }}-attempt-${{ github.run_attempt }}
          retention-days: 30
          if-no-files-found: warn
          path: |
            release-candidate/content-release-status.json
            release-candidate/content-candidate.json
            release-candidate/content-preflight.json
            release-candidate/portable-catalog.json
            release-candidate/portable-learning-content-publication.json
