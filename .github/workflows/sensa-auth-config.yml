name: Reconcile production Auth redirects
on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: Full Git commit SHA containing the reviewed redirect contract
        required: true
      owner_authorized:
        description: Owner authorizes reconciling production Supabase Auth redirects
        type: boolean
        required: true
        default: false
permissions:
  contents: read
concurrency:
  group: sensa-production-auth-config
  cancel-in-progress: false
jobs:
  reconcile:
    if: inputs.owner_authorized
    environment: web-production
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SENSA_RELEASE_SHA: ${{ inputs.release_sha }}
      SENSA_WEB_ORIGIN: ${{ vars.SENSA_WEB_ORIGIN }}
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.release_sha }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - run: node scripts/release/verifyRevision.mjs
      - name: Apply and verify production Auth redirect configuration
        run: node scripts/release/supabaseAuthConfig.mjs --apply
