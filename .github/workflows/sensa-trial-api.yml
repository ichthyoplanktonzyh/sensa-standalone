name: Deploy isolated Sensa trial API
on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: Full reviewed Git commit SHA
        required: true
      owner_authorized:
        description: Owner authorizes deploying this SHA to the isolated trial project
        type: boolean
        required: true
        default: false
permissions:
  contents: read
concurrency:
  group: sensa-trial-api
  cancel-in-progress: false
jobs:
  deploy:
    if: inputs.owner_authorized
    environment: sensa-trial
    runs-on: ubuntu-latest
    env:
      SUPABASE_PROJECT_REF: kwwmukqzlxxsnviyhwmr
      SENSA_WEB_ORIGIN: https://sensa-standalone.ichthyoplanktonzyh.workers.dev
      VITE_SENSA_API_URL: https://kwwmukqzlxxsnviyhwmr.supabase.co/functions/v1/sensa-api
      NODE_EXTRA_CA_CERTS: ${{ github.workspace }}/infra/certs/supabase-prod-ca-2021.crt
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_sha }}
      - name: Verify reviewed revision
        env:
          REVIEWED_SHA: ${{ inputs.release_sha }}
        run: |
          node --input-type=module <<'JS'
          import {execFileSync} from 'node:child_process';
          if(!/^[a-f0-9]{40}$/.test(process.env.REVIEWED_SHA??'')||execFileSync('git',['rev-parse','HEAD'],{encoding:'utf8'}).trim()!==process.env.REVIEWED_SHA)throw Error('Reviewed full SHA required');
          JS
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Build and check reviewed API
        run: |
          npm run build -w @sensa/learning-kernel
          npm run build -w @sensa/contracts
          npm run build -w @sensa/content-validator
          npm run build -w @sensa/model-runtime
          npm run build -w @sensa/intake-transport
          npm run build -w @sensa/api
          npm run sensa:edge-check
      - uses: supabase/setup-cli@v1
        with:
          version: 2.117.0
      - name: Configure trial service boundaries
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SENSA_RUNTIME_DATABASE_URL: ${{ secrets.SENSA_RUNTIME_DATABASE_URL }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          SENSA_PROVIDER_VAULT_KEY: ${{ secrets.SENSA_PROVIDER_VAULT_KEY }}
        run: |
          node scripts/release/serviceEnvironment.mjs
          trap 'rm -f "$RUNNER_TEMP/sensa-service.env"' EXIT
          supabase secrets set --env-file "$RUNNER_TEMP/sensa-service.env" --project-ref "$SUPABASE_PROJECT_REF"
      - name: Deploy API
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase functions deploy sensa-api --project-ref "$SUPABASE_PROJECT_REF"
      - name: Verify public authentication and CORS boundary
        run: |
          node --input-type=module <<'JS'
          const response=await fetch(process.env.VITE_SENSA_API_URL+'/sensa/packages',{headers:{Origin:process.env.SENSA_WEB_ORIGIN},signal:AbortSignal.timeout(20000)});
          const body=await response.json();
          if(response.status!==401||body.code!=='authentication_required'||response.headers.get('access-control-allow-origin')!==process.env.SENSA_WEB_ORIGIN)throw Error('Trial API boundary verification failed');
          console.log('Trial API authentication and CORS boundary verified.');
          JS
